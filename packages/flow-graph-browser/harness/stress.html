<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>flow graph stress</title>
<style>
  /* The controls only. `#host` and everything a scene mounts stay unstyled here: a style on the measured surface changes the numbers. */
  :root { --fg-ink: #1c2733; --fg-panel: #eef2f6; --fg-run: #2f5f9e; --fg-focus: #e0a100; }
  body { margin: 0; font-family: system-ui, sans-serif; color: var(--fg-ink); background: #fff; }
  #run { display: block; min-height: 48px; margin: 12px 16px; padding: 12px 28px; border: 0; border-radius: 10px; background: var(--fg-run); color: #fff; font: 600 20px/1 system-ui, sans-serif; cursor: pointer; }
  #run:focus-visible { outline: 3px solid var(--fg-focus); outline-offset: 3px; }
  #out { margin: 0 16px 24px; padding: 12px 16px; border-left: 4px solid var(--fg-run); background: var(--fg-panel); font: 17px/1.5 system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: pre-wrap; overflow-wrap: anywhere; }
  #out:empty { display: none; }
</style></head>
<body><div id="host"></div>
<button id="run" type="button">Run</button><pre id="out" aria-live="polite"></pre>
<script type="module" src="./stress.tsx"></script></body></html>
