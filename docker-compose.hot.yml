# ============================================================================
#
# **The owner removed hot reload.** Verbatim: *"no more hot reloads. rebuilt once
# they hit the main, is fine. that means the servers are to be run from the main
# folder instead of from the executor's branch. bring up the server once the hot
# reload is removed."*
#
# What that retired, mechanically: `pnpm dev:stack` (root `package.json`) used to
# compose this file. **It no longer does** — it now names `docker-compose.dev.yml`
# alone, so the stack serves the BUILT images from `/Users/kiro/my_projects/gisik-nokma`.
# `pnpm dev:stack:rebuild` is the same stack with `--build`, and is the command the
# runbook's rebuild rule names after every merge to `main`.
#
# **WHY THIS FILE IS KEPT RATHER THAN DELETED.** Not sentiment: it is the only
# record of a set of measurements that cost real time to take and would otherwise
# have to be re-derived from scratch, and each one is a fact about this machine's
# Docker Desktop mount rather than about a feature:
#   - the rename-over save shape does not cross the mount at all, and on
#     `tsx watch` the first miss is PERMANENT (chokidar loses the watch);
#   - `node --watch --import tsx` was measured and does NOT work here, and not
#     for the mount reason — it misses writes made INSIDE the container too;
#   - busybox `kill -0` succeeds on an exited-but-unreaped child, so a liveness
#     supervisor for a backgrounded watcher cannot fire (a guard that cannot fire
#     is worse than none, which is why the runbook carries an operator check);
#   - compose v2 shell-word-SPLITS a string-form `command`, so `sh -c` is
#     load-bearing rather than decorative;
#   - the settled `docker stats` prices of polling versus not.
# **A deleted file takes its reasons with it.** Read the body below as the
# record it is, not as a mode to restore.
#
# The `:3001` ownership rule this file's header states ("for the serial executor,
# `/Users/kiro/my_projects/gisik-nokma-exec`") is ALSO retired — see the note at
# that paragraph, and the runbook. There is no executor-owned stack any more.
#
# ============================================================================
# ORIGINAL HEADER, 2026-09-18, unedited below this line except where marked.
# ============================================================================
#
# Hot-reload dev mode for the compose `server` and `web` services.
#
# NOT usable on its own. It is an OVERRIDE, always composed with the base file:
#
#   docker compose --env-file .env \
#     -f docker-compose.dev.yml -f docker-compose.hot.yml up -d server web
#
# `docker-compose.dev.yml` is deliberately UNCHANGED by this file's introduction
# — the prod-parity image path and the compose contract suite keep reading it
# exactly as before, and the prod images are still the un-targeted builds.
# `pnpm dev:stack` (root package.json) WAS that command. **[FALSE SINCE
# 2026-09-19 — see the retirement banner at the head of this file. `dev:stack`
# now names `docker-compose.dev.yml` alone and does NOT compose this file.]**
#
# What changes here: the `server` and `web` containers run the branch's SOURCE
# from bind mounts instead of the baked artifacts, with watchers that reload them
# on save. So the code the owner sees live — the browser on :3001 (the `web`
# container), proxied to the API on :3000 (the `server` container) — is the code
# in the checkout this file is invoked from: for the serial executor,
# `/Users/kiro/my_projects/gisik-nokma-exec`, on whatever branch that worktree is
# on.
#
# [CORRECTED 2026-09-19 — the sentence above is history, and the RULE it assumed
# is gone.] "which checkout this file is invoked from" was the whole point of hot
# mode and it is exactly what the owner retired: the stack is now served from
# `/Users/kiro/my_projects/gisik-nokma` (the MAIN folder) as built images, so no
# executor's branch is ever live. Two consequences a reader here must not carry
# forward: **there is no executor-owned stack**, and **no one binds :3001 to an
# executor's tree** — the :3001 ownership rule that existed *because* the
# container mounted exec 1's branch died with the mounting.
#
# THE `web` HALF ARRIVED SECOND, and it retires a sentence this header used to
# carry. Until it did, ":3001" was the owner's own `next dev` and the only live
# process here was the server on :3000; the header named :3001 as where "the
# owner sees" the hot code, which was true of the browser and misleading about
# the container. Now that both halves are hot, the two ports are named above and
# neither is the other's shorthand.
#
# Compose MERGES the `volumes` list with the base file's, so the base's
# `./reference:/app/reference:ro` survives alongside the mounts below. That is
# harmless and is left in place rather than shadowed with `!override`: `/app`
# does not exist in the dev stage, so Docker materialises an empty directory
# there and nothing reads it. The `./reference` mount that DOES matter is the
# one at `/repo/reference` below, because `seed:cc` resolves
# `reference/convenience-corner-tracker/board.data.js` relative to the working
# directory, which in this stage is `/repo`.
#
# The compose project `name: gisik-nokma-dev` is declared in the base file and
# is NOT re-declared here — that is what makes this a REPLACEMENT of
# `gisik-nokma-dev-server-1` rather than a second stack.

services:
  server:
    build:
      # `context` is inherited from docker-compose.dev.yml. `dockerfile` is
      # OVERRIDDEN here — task/docker-build-cache (2026-09-23) moved the `dev`
      # stage out of `apps/server/Dockerfile` into its own
      # `apps/server/Dockerfile.dev`, so this override can no longer inherit
      # the base file's `dockerfile:`. `target: dev` still names the stage
      # inside it, which is no longer strictly required (it is the only stage
      # in that file) but is kept for parity with the `web` service below and
      # because it is what the comments elsewhere in this file still say.
      dockerfile: apps/server/Dockerfile.dev
      target: dev
    # Migrations first (the same thing the prod entrypoint does), then the
    # package watchers in parallel with the server's own source watcher.
    #
    # The watcher shape mirrors the owner's proven host workflow
    # (`.vscode/tasks.json`, not in git):
    #   pnpm -r --parallel --filter './packages/*' exec tsc -p tsconfig.json --watch
    # beside `next dev`. Each package's tsconfig emits `dist` (`outDir: dist`,
    # `rootDir: src`), and consumers import workspace packages BY NAME
    # (`@gisik-nokma/domain` resolves through `./dist`), so a source edit here
    # reaches the server by way of `dist` — which is exactly what witness W3
    # measures.
    #
    # [SUPERSEDED 2026-09-18 by the note below — polling IS enabled now. This
    # paragraph is kept, not deleted, because its BAR is the right one and the
    # note below clears it: the fix was applied only after the missing event was
    # named and measured, not on suspicion. Read the two together.]
    # Polling is NOT enabled: if inotify events were provably not
    # crossing the Docker Desktop mount, the fix would be stated with the
    # measurement that showed the missing event, not applied on suspicion.
    #
    # THE SERVER'S WATCHER POLLS, AND THAT WAS NOT THE FIRST CHOICE — 2026-09-18.
    #
    # The defect this answers: `tsx watch` uses chokidar, which does not merely
    # MISS a rename-over save — the atomic-save shape, which is also exactly what
    # the assistant's own Edit tool writes (the host inode changes on every edit;
    # measured three times across two files) — it PERMANENTLY LOSES its watch on
    # that file. After one such write to `src/index.ts`, neither a true in-place
    # write (host inode preserved, measured) nor a `touch` produced a `[tsx]`
    # line in 15-20 s, while the SAME in-place write on a freshly restarted
    # container produced `[tsx] change in ./src/index.ts Restarting...` in 0.5 s.
    # Consequence: the live API serves STALE code while `/healthz` answers 200,
    # `docker ps` says healthy, and the file on the mount is correct — the
    # 2026-09-09 shape this whole file exists to prevent, reachable with no
    # rebuild involved.
    #
    # `node --watch --import tsx src/index.ts` WAS MEASURED FIRST, because Node's
    # watch mode watches each loaded module's PARENT DIRECTORY rather than the
    # inode and so should be indifferent to the save shape. IT DID NOT WORK HERE,
    # and not for the expected reason: with the entry point running under it, a
    # host rename-over, a host IN-PLACE write, and a write made INSIDE the
    # container all failed to restart the process — 0 `Restarting` lines, child
    # pid unchanged, marker never printed. A container-local write crosses no
    # mount at all, so that is the watcher not seeing its own entry point rather
    # than virtiofs losing events. The first door is therefore closed by
    # measurement, not by preference.
    #
    # What is enabled instead is the fallback the earlier note rejected on the
    # evidence then available — that in-place writes DO cross the mount. That
    # stopped being sufficient once the writer that matters turned out to be a
    # rename. tsx 4.23.12 carries chokidar's `usePolling` (measured); the CPU
    # cost is recorded in the PR body as `docker stats` settled, polling on
    # versus off.
    # `sh -c` IS LOAD-BEARING, not decoration. Compose v2 does NOT run a
    # string-form `command` through a shell: it shell-word-SPLITS it and execs
    # the result. Measured on this file before this fix — `config` rendered
    # `set`, `-e`, `echo`, … as nine separate argv entries, so the container
    # would have died trying to exec a program named `set`, and the `&` that
    # backgrounds the watchers and every `;` would have been lost with it. The
    # explicit `sh -c` is the only form that keeps the sequencing.
    command:
      - sh
      - -c
      - |
        set -e
        echo 'hot-dev: applying migrations...'
        pnpm --filter @gisik-nokma/server migrate
        echo 'hot-dev: migrations current; starting watchers'
        pnpm -r --parallel --filter './packages/*' exec tsc -p tsconfig.json --watch --preserveWatchOutput &
        pnpm --filter @gisik-nokma/server exec tsx watch src/index.ts
    # NO SUPERVISOR HERE, AND IT WAS TRIED RATHER THAN OMITTED. `set -e` does not
    # cover a backgrounded job, so if the package watcher dies the container
    # stays up and /healthz keeps answering while package edits silently stop
    # reaching `dist`. A supervisor that watches it was written, shipped to a
    # running container, and MEASURED NOT TO FIRE: `pkill` on the tsc processes
    # left the container healthy and `restarts=0`. Two reasons it cannot work in
    # this shell, both measured -- busybox ash has no `wait -n` (a job exiting 7
    # reported status 0), and `kill -0` on a backgrounded child that has exited
    # but not been reaped still SUCCEEDS, so the liveness test never turns false.
    # It is removed rather than left in: a guard that cannot fire is worse than
    # none, because it is trusted. The failure is therefore DOCUMENTED as an
    # operator check instead (`docs/runbook.md`, "watchers still alive"), which
    # is the honest form -- a check someone runs beats a guard that lies.
    environment:
      # THE PACKAGE WATCHERS' SAVE SHAPE — 2026-09-18, Step 2 Part 0.
      #
      # The `tsc --watch` loop in `command` above carries the SAME inode bug the
      # long note above records for `tsx watch`, and #417 measured it as case
      # 13.656: a `packages/ui/src` edit stopped reaching `dist` and no `touch`
      # revived it — only `restart web` did. The cause is the default watch
      # strategy. `tsc`'s default is `UseFsEvents`, which in the 5.9.3 bundle
      # (case 4) is `fsWatch(fileName, File, ...)` — a watch on the FILE, which
      # follows the inode and so goes blind on the rename-over save the
      # assistant's Edit tool writes (inode measured changing on every edit).
      #
      # `UseFsEventsOnParentDirectory` (case 5) is what ships. It watches the
      # parent DIRECTORY (`fsWatch(dirName, Directory, ...)`) instead of the
      # file's inode, so a rename onto that name is an event it sees. Witnessed
      # in BOTH containers, no restart between the halves: a rename-over Edit
      # reached both `dist` copies in ~1 s (host write 1789679099, compile line
      # 2:35:00); an in-place append that followed reached both `dist` copies in
      # ~1 s (host inode 204132254 before AND after, so provably not a rename;
      # write 1789679122, compile line 2:35:22); and the revert put both back to
      # zero. Settled `docker stats` for the pair: 3.99-6.69 % (server) and
      # 1.55-1.69 % (web), beside #417's chokidar figure of 6.05-6.47 % on
      # versus 2.39-3.73 % off for the server.
      #
      # TWO INSTRUMENTS THAT LIED, recorded because each produced a confident
      # false "the watcher is blind" reading before it was caught — and the
      # second of them was written into this comment as a conclusion:
      #   1. **A marker the EMITTER does not carry measures nothing.** A marker
      #      comment placed before an elided declaration (`export type {
      #      PrefsOrigin }` — a type-only re-export, absent from the JS output)
      #      is dropped along with it, and a bare `//` comment appended at EOF is
      #      dropped too, while a STATEMENT marker at that same EOF position is
      #      emitted. Both read as `0 in dist` and look exactly like a watcher
      #      failure. The marker must be one the emitter actually carries; a
      #      statement is the safe choice.
      #   2. **A poll timed from the operator's own tool call measures the
      #      OPERATOR.** The write is often already compiled before the first
      #      poll runs, so the loop reports "0 s" and measures nothing; and a
      #      broken marker's "0 in dist" is then read as a watcher verdict. The
      #      honest instrument is the compile line in `docker logs --since …`
      #      read against the host file's mtime, which is what the figures above
      #      quote.
      #
      # The env var is read RAW (`process.env.TSC_WATCHFILE` in the 5.9.3
      # bundle), so the spelling below is load-bearing and is the exact string
      # the `TSC_WATCHFILE` switch compares against — a lowercased or
      # hyphenated variant falls through to the default and silently changes
      # nothing.
      TSC_WATCHFILE: UseFsEventsOnParentDirectory
      # POLLING, and only because the measured default misses the save shape the
      # assistant's editor writes — see the watcher note above for the measurement
      # and for why the first door (node --watch) was closed instead.
      # `CHOKIDAR_INTERVAL` is milliseconds; 1000 is chokidar's own default and is
      # stated rather than left implicit so the reload latency it implies (~1 s)
      # is a documented choice rather than a surprise.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    volumes:
      # SOURCE ONLY. Two things are deliberately absent and both would break the
      # container if mounted:
      #   node_modules — the host's are macOS-native, the container's are Linux;
      #                  `tsx` needs `@esbuild/linux-*`, which the host tree
      #                  does not have. Mount it and the server stops booting.
      #   dist         — written IN the container by the watchers. The owner's
      #                  host `tsc --watch` writes the host's copy; sharing the
      #                  directory would put two writers on one path.
      - ./apps/server/src:/repo/apps/server/src
      - ./apps/server/migrations:/repo/apps/server/migrations
      - ./packages/app-core/src:/repo/packages/app-core/src
      - ./packages/domain/src:/repo/packages/domain/src
      - ./packages/editor/src:/repo/packages/editor/src
      - ./packages/mcp-server/src:/repo/packages/mcp-server/src
      - ./packages/rule-engine/src:/repo/packages/rule-engine/src
      - ./packages/sync-client/src:/repo/packages/sync-client/src
      - ./packages/ui/src:/repo/packages/ui/src
      - ./reference:/repo/reference:ro

  # ---------------------------------------------------------------------------
  # THE `web` HALF OF HOT MODE. Added 2026-09-18, one step after the `server`
  # half above, and it retires the owner's own `next dev` on :3001 — the process
  # whose absence the Step 1 header called "the server I was running".
  #
  # `ports: "3001:3000"` is INHERITED from docker-compose.dev.yml and not
  # restated here, which is why `next dev` runs on 3000 INSIDE: the browser's
  # :3001 is the host side of that mapping. `depends_on: server: service_healthy`
  # is inherited the same way — compose merges the map — so the proxy target is
  # answering before this starts serving.
  web:
    build:
      # `context` and the base file's two build args are inherited; `dockerfile`
      # is OVERRIDDEN, same reason and same shape as the `server` service above
      # — the `dev` stage moved to `apps/web/Dockerfile.dev` on
      # task/docker-build-cache (2026-09-23).
      dockerfile: apps/web/Dockerfile.dev
      target: dev
    command:
      # `sh -c` explicitly, for the measured reason given at `server` above:
      # compose v2 shell-word-SPLITS a string-form `command` and execs the
      # result, so without this the container would die on a program named
      # `set` and the `&` would be lost.
      #
      # THE SAME `tsc --watch` LOOP AS `server`, and deliberately not a shared
      # watcher: two containers reading one host source tree is fine, two
      # WRITERS on one `dist` is not, so each container writes its own. That
      # costs a second set of seven watchers — measured rather than waved at:
      # `docker stats --no-stream` on the settled pair appears in case 13.656.
      #
      # NO SUPERVISOR HERE EITHER, and for the same measured reason the `server`
      # service records at length: `kill -0` succeeds on an exited-but-unreaped
      # background child in busybox ash, so a liveness guard there cannot fire.
      # A dead package watcher is checked by hand, in the runbook's web
      # paragraph, which carries the same operator command.
      - sh
      - -c
      - |
        set -e
        echo 'hot-web: starting package watchers'
        pnpm -r --parallel --filter './packages/*' exec tsc -p tsconfig.json --watch --preserveWatchOutput &
        echo 'hot-web: starting next dev on :3000 (host :3001)'
        pnpm --filter @gisik-nokma/web exec next dev -p 3000 -H 0.0.0.0
    environment:
      # THE SAME PACKAGE-WATCHER FIX AS `server` ABOVE, and stated here rather
      # than pointed at because a reader of this service should not have to
      # travel: this container runs its OWN copy of the identical
      # `tsc -p tsconfig.json --watch` loop (see `command`), so it has its own
      # instance of the same inode bug and needs its own instance of the fix.
      # Both halves are witnessed together in case 13.656 — one write, both
      # `dist` copies — which is why the two lines must not drift apart.
      TSC_WATCHFILE: UseFsEventsOnParentDirectory
      # The prod image takes its two load-bearing knobs as BUILD args, because
      # `next build` serialises them into .next. `next dev` does not: it loads
      # next.config.ts at start and reads process.env, so in hot mode they are
      # RUNTIME environment and that is the whole difference between this block
      # and the base file's `args:`.
      #
      # SERVER_ORIGIN must be the compose service name, and what the wrong value
      # does was measured against a live stack rather than predicted: with
      # `http://localhost:3000` inside this container the proxied path returns
      # **HTTP 500 after a 30-second hang** (EADDRNOTAVAIL on 127.0.0.1:3000),
      # while every other signal looks healthy — the server is up, the web
      # container is Up, and `GET :3001/` still answers 307. Only /v1/* fails.
      SERVER_ORIGIN: http://server:3000
      # NEXT_PUBLIC_ means "baked into the browser bundle", so this one names
      # the host-published port and NOT the service: the browser dials it
      # directly for the /v1/stream socket, which the rewrites deliberately do
      # not cover.
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      # Declared for parity with the prod image's three remaining build args, and
      # they are EMPTY for the same reason those are: `apps/web/Dockerfile`
      # records that all three have ZERO readers in apps/ or packages/ (swept,
      # with a positive control), and the primary checkout's `.env` carries
      # `GOOGLE_CLIENT_ID`, not these names. Named here so the knobs a future
      # Drive-picker wiring would reach for exist in hot mode too — and so that
      # nobody reads their absence as evidence the wiring is elsewhere.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
      NEXT_PUBLIC_GOOGLE_PICKER_API_KEY: "${NEXT_PUBLIC_GOOGLE_PICKER_API_KEY:-}"
      NEXT_PUBLIC_GOOGLE_APP_ID: "${NEXT_PUBLIC_GOOGLE_APP_ID:-}"
    volumes:
      # SOURCE ONLY, and the same two absences as `server` for the same reasons:
      #   node_modules — the host's are macOS-native and the container's are
      #                  Linux, so mounting them breaks the container rather
      #                  than merely stale-ing it.
      #   dist         — written IN each container by its own watchers.
      # Plus a third that is specific to this container:
      #   .next        — the dev compile cache, and it MUST be the container's
      #                  own. A host `.next` is a macOS build of a different
      #                  platform; `.dockerignore` already keeps it out of the
      #                  image (`**/.next`), and mounting it would put a foreign
      #                  cache in the compiler's path.
      #
      # NOT MOUNTED, and each for a reason rather than by omission: `tsconfig.json`
      # (Next REWRITES this file when it needs to — for example to add
      # `next-env.d.ts` to `include` — so a read-write bind mount would let the
      # container edit the host's tracked file) and `package.json` (a dependency
      # change is a lockfile change, and the runbook's rebuild rule already
      # covers that path). Neither is read per-request, so a host edit to one
      # needs a `--build`, the same as a new package.
      - ./apps/web/app:/repo/apps/web/app
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/public:/repo/apps/web/public
      - ./apps/web/next.config.ts:/repo/apps/web/next.config.ts
      - ./packages/app-core/src:/repo/packages/app-core/src
      - ./packages/domain/src:/repo/packages/domain/src
      - ./packages/editor/src:/repo/packages/editor/src
      - ./packages/mcp-server/src:/repo/packages/mcp-server/src
      - ./packages/rule-engine/src:/repo/packages/rule-engine/src
      - ./packages/sync-client/src:/repo/packages/sync-client/src
      - ./packages/ui/src:/repo/packages/ui/src
