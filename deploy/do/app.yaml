# DigitalOcean App Platform spec -- the ONLY file that knows the provider.
# Region: blr (Bengaluru) -- the audience constraint is India-reachable,
# phone-first; the region is the point, not a default. Spaces is SGP1 (not BLR1 — see
# deploy/do/README.md step 2: on go-live day, 2026-09-22, BLR1 Spaces refused CreateBucket
# for this account while SGP1 accepted it; app and database stay in BLR1) for
# the same reason: user uploads stay in India, beside the ledger.
# DOMAINS: pm.artsourced.in serves the web app, pm-api.artsourced.in serves
# the API. Two sibling single-label subdomains in the artsourced.in zone,
# not a nested name: two plain CNAMEs, one each (see README.md Step 5).
#
# NOT APPLIED TO ANY LIVE APP. This is a written spec only -- Plan 11's scope
# explicitly excludes the act of deploying it (owner instruction, 2026-09-06).
#
# Env var names below are written against apps/server/src/config.ts's zod
# schema and .env.example on origin/main at the sha this file was written
# (see the PR that added it for the exact sha), NOT against this plan
# section's own original draft -- that draft named `S3_ENDPOINT`,
# `S3_REGION`, `S3_BUCKET`, `S3_ACCESS_KEY`, `S3_SECRET_KEY` for object
# storage and `NEXT_PUBLIC_API_URL`/`NEXT_PUBLIC_WS_URL` for the web client,
# and none of those five are read by any shipped code:
#   - Attachments (Plan 7 Task 8's createObjectStoreFromEnv) reads
#     OBJECT_STORE, OBJECT_STORE_DIR, OBJECT_STORE_S3_REGION,
#     OBJECT_STORE_S3_BUCKET, OBJECT_STORE_S3_ACCESS_KEY_ID,
#     OBJECT_STORE_S3_SECRET_ACCESS_KEY, OBJECT_STORE_S3_ENDPOINT,
#     OBJECT_STORE_S3_FORCE_PATH_STYLE -- a separate, later-added variable
#     set from the unread `S3_*` block .env.example's own header warns about.
#   - The web shell reads SERVER_ORIGIN (dev/build-time proxy target,
#     never sent to the browser) and NEXT_PUBLIC_SERVER_URL (baked into the
#     bundle, the origin the WebSocket dials directly -- streamUrl() appends
#     /v1/stream and rewrites http->ws itself, so this is an origin, not a
#     socket URL). In production that origin is the WEB host, and the
#     ingress rules route its /v1 and /api/auth paths to the server, so the
#     socket carries the session cookie (see the ingress block). Neither NEXT_PUBLIC_API_URL nor NEXT_PUBLIC_WS_URL has a
#     reader anywhere in apps/web.
name: gisik-nokma
region: blr

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: gisik-nokma-db

services:
  - name: server
    dockerfile_path: apps/server/Dockerfile
    source_dir: /
    github:
      repo: bkirosangma/gisik-nokma
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_size_slug: professional-xs
    instance_count: 1
    health_check:
      http_path: /healthz
      initial_delay_seconds: 20
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      # Honoured, and it has been since Plan 11 Task 1: config.ts's zod schema
      # takes an optional PEM under this name, and db.ts applies it to the
      # pool -- failing loudly rather than silently when the CA cannot be
      # applied to the URL's connection form. So this key is LOAD-BEARING; it
      # read "not yet in config.ts's zod schema ... inert until then".
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      - key: HOST
        value: "0.0.0.0"
      # Owner decision 2026-08-20: time is Asia/Kolkata. TZ sets the Node
      # process's own zone, so server logs and any `Date` the runtime
      # formats agree with the database's own clock (set separately, on the
      # managed database itself -- README.md Step 6, not from the app side).
      - key: TZ
        value: Asia/Kolkata
      # DEPLOY_SHA (apps/server/src/config.ts, `z.string().min(1)
      # .default('dev')` -- it has LANDED; this parenthetical read
      # "forthcoming on Lane E's branch, uncommitted as of this file's
      # writing") is
      # DELIBERATELY NOT set here. /healthz serves it verbatim on BOTH its
      # 200 and 503 branches so an operator can tell which commit answered
      # during an incident -- that is the whole reason Ruling P33 exists.
      # App Platform does not populate a commit sha into a static spec on
      # its own, and this file cannot make itself current on every deploy;
      # setting an explicit placeholder value here (`dev`) would read as a
      # deliberate production value a reviewer skims past, when what it
      # actually means is "nobody has wired this yet". An absent key falls
      # through to config.ts's own `dev` default with the same runtime
      # behaviour, honestly. Closing the actual gap -- a CI step that
      # patches this key to the pushed sha and calls
      # `doctl apps update <app-id> --spec deploy/do/app.yaml` after
      # `deploy_on_push` fires -- belongs in `.github/workflows/ci.yml`
      # (Task 14, this lane's other file) but is NOT built here: it would
      # itself be a live-deploy action, which is explicitly out of scope
      # for both tasks (owner instruction, 2026-09-06).
      # Required behind App Platform's router (every client would otherwise
      # share one rate-limit bucket). The limiter keys on the RIGHTMOST
      # X-Forwarded-For entry -- the nearest trusted proxy's own observation,
      # which a caller cannot write (`http/rate-limit.ts`'s `rateLimitKeyFor`,
      # and the last-occurrence rule beside it) -- so a forged leftmost entry
      # buys nothing. That is Plan 11 Task 2 and it IS on main; this comment
      # used to say the fix was "not yet on main" and that "the forged-header
      # gap above is open on whatever is on main". Both are superseded.
      - key: TRUST_PROXY
        value: "true"
      # These two are DIFFERENT ORIGINS, and that is the condition that broke
      # sign-in in the dev compose stack before Plan 11 Task 13 measured it.
      # WEB_ORIGIN is appended to better-auth's `trustedOrigins`, which
      # otherwise holds only BETTER_AUTH_URL's origin -- the API host, which no
      # browser ever sends. Without that, a browser on pm.artsourced.in posting
      # to the auth surface is answered `403 {"code":"INVALID_ORIGIN"}`. This
      # deploy would have met it exactly as the compose stack did.
      #
      # STILL OPEN FOR THIS TOPOLOGY, and it is not the same gap: if the web app
      # ever calls the API host CROSS-ORIGIN instead of proxying same-origin,
      # the CORS preflight has to be answered too -- `OPTIONS` is not mounted on
      # the auth catch-all and 404s before better-auth is reached
      # (`apps/server/test/auth/sign-in-flows.test.ts`, "known gap: OPTIONS and
      # HEAD are not mounted"). Trusting the origin is necessary, not sufficient.
      - key: WEB_ORIGIN
        value: https://pm.artsourced.in
      # THE WEB ORIGIN, NOT THE API HOST (go-live day, 2026-09-22). The web app's
      # auth client posts to ITS OWN origin and Next.js proxies `/api/auth/*` to
      # this server (`apps/web/next.config.ts` rewrites; `apps/web/src/auth-client.ts`
      # `baseURL: window.location.origin`). So the OAuth state cookie is stored by
      # the browser against pm.artsourced.in — and better-auth builds the Google
      # redirect URI from THIS value. With the API host here, Google returned the
      # browser to pm-api.artsourced.in, where that cookie is never sent, and every
      # sign-in ended in `state_security_mismatch` ("State not persisted correctly").
      # The dev stack hid it: both hosts were localhost, and cookies ignore ports.
      # Google's registered redirect URI is therefore
      # `https://pm.artsourced.in/api/auth/callback/google`.
      - key: BETTER_AUTH_URL
        value: https://pm.artsourced.in
      - key: BETTER_AUTH_SECRET
        type: SECRET
      - key: SMTP_URL
        type: SECRET
      # Social sign-in. Every one of these is declared with NO value: the owner
      # sets them in the DigitalOcean control panel, never in this file, and a
      # SECRET-typed key with no value here is how the app spec asks for one
      # without carrying it. Both providers ship INERT — `social-providers.ts`
      # omits a provider unless BOTH halves of its pair are non-empty, and
      # `GET /v1/auth/methods` answers from that same object, so an unset pair
      # renders no button rather than a button that fails at the server.
      #
      # Google's redirect URI must be registered as
      # `https://pm.artsourced.in/api/auth/callback/google` — the WEB host, because
      # the browser reaches this component only through the web app's proxy (see
      # BETTER_AUTH_URL above).
      - key: GOOGLE_CLIENT_ID
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        type: SECRET
      # Apple's client_id is the SERVICES ID, and its return URL is
      # `https://pm-api.artsourced.in/api/auth/callback/apple`. Sign in with
      # Apple needs HTTPS and a verified domain, so it cannot be exercised on
      # localhost — this deployment is where it is first testable.
      - key: APPLE_CLIENT_ID
        type: SECRET
      # NOT a password: a client-secret JWT minted by
      # `scripts/mint-apple-client-secret.mjs` that EXPIRES (Apple caps it at
      # six months). Rotation is an operational task with a runbook entry, and
      # it is the one credential here that will fail on a working deployment
      # simply by the passage of time.
      - key: APPLE_CLIENT_SECRET
        type: SECRET
      # The native app's bundle id. Not a secret, and NOT harmless when set on
      # its own: better-auth has ONE id-token audience per provider, so a bundle
      # id alone REPLACES the Services ID and breaks every web sign-in.
      # `social-providers.ts` passes an explicit audience list containing both
      # whenever this is set. Leave it unset until the mobile app ships Sign in
      # with Apple.
      - key: APPLE_APP_BUNDLE_IDENTIFIER
        type: SECRET
      # Confirmed by the owner 2026-08-20, corrected 2026-09-02: the apex
      # address, not a subdomain one.
      - key: MAGIC_LINK_FROM
        value: contact@artsourced.in
      - key: ALERT_WEBHOOK_URL
        type: SECRET
      - key: RATE_LIMIT_AUTH_MAX
        value: "10"
      - key: RATE_LIMIT_EVENTS_MAX
        value: "120"
      - key: RATE_LIMIT_WINDOW_SEC
        value: "60"
      # Attachments (Plan 7 Task 8) -- 's3' selects the S3-protocol
      # implementation; DO Spaces is S3-compatible. Subdomain-style
      # addressing, not path-style (that's MinIO's shape, for local dev).
      - key: OBJECT_STORE
        value: s3
      - key: OBJECT_STORE_S3_ENDPOINT
        value: https://sgp1.digitaloceanspaces.com
      - key: OBJECT_STORE_S3_REGION
        value: sgp1
      - key: OBJECT_STORE_S3_BUCKET
        value: gisik-nokma-attachments
      - key: OBJECT_STORE_S3_FORCE_PATH_STYLE
        value: "false"
      - key: OBJECT_STORE_S3_ACCESS_KEY_ID
        type: SECRET
      - key: OBJECT_STORE_S3_SECRET_ACCESS_KEY
        type: SECRET
      # Backup daemon's own bucket name (Plan 11); documented in
      # .env.example and, since Task 11 landed, read by
      # apps/server/src/ops/object-sink.ts -- but only from the `backup`
      # worker below, which is the component that runs that code. Kept on the
      # `server` component too so `pnpm --filter @gisik-nokma/server
      # ops:backup-once` and ops:fetch-backup work from a console session on
      # the API box during a restore.
      - key: BACKUP_S3_BUCKET
        value: gisik-nokma-backups

  - name: web
    dockerfile_path: apps/web/Dockerfile
    source_dir: /
    github:
      repo: bkirosangma/gisik-nokma
      branch: main
      deploy_on_push: true
    http_port: 3000
    instance_size_slug: basic-xs
    instance_count: 1
    envs:
      # Read by apps/web/next.config.ts at build time for the /v1/* and
      # /api/auth/* rewrites; never sent to the browser. BUILD_TIME because
      # Next resolves rewrites at build, not at request time. In production
      # the ingress rules below route those two prefixes on the web host to
      # the server before Next sees them, so the rewrites are a fallback, not
      # the path; unchanged, and pinned as the control in 13.1425.
      - key: SERVER_ORIGIN
        value: https://pm-api.artsourced.in
        scope: BUILD_TIME
      # Baked into the bundle (NEXT_PUBLIC_ means exactly that) -- the
      # origin the browser dials the WebSocket at directly, since Next's
      # production server does not proxy protocol upgrades. It is the WEB
      # host, not pm-api: the session cookie belongs to pm.artsourced.in
      # only, so a socket dialled anywhere else is refused (401) at the
      # upgrade. The ingress rules at the bottom of this file route /v1 on
      # this host to the server component. An https:// origin, not wss://
      # -- streamUrl() does that rewrite itself. Pinned by 13.1425.
      - key: NEXT_PUBLIC_SERVER_URL
        value: https://pm.artsourced.in
        scope: BUILD_TIME

workers:
  - name: backup
    dockerfile_path: apps/server/Dockerfile
    source_dir: /
    github:
      repo: bkirosangma/gisik-nokma
      branch: main
      deploy_on_push: true
    # CONFIRMED 2026-09-06, when Task 11 landed: apps/server/tsconfig.json sets
    # rootDir "src", outDir "dist", include ["src"], so
    # src/ops/backup-daemon-main.ts emits to dist/ops/backup-daemon-main.js --
    # exactly the path below. Checked against a clean run of both
    # `tsc -p tsconfig.json --noEmit` and `tsc -p tsconfig.typecheck.json
    # --noEmit`. Recorded here so the next reader does not redo it.
    run_command: node dist/ops/backup-daemon-main.js
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
      - key: DATABASE_CA_CERT
        value: ${db.CA_CERT}
        scope: RUN_TIME
      # The worker formats log timestamps too -- same clock as the server,
      # or a backup failure gets read against the wrong evening.
      - key: TZ
        value: Asia/Kolkata
      - key: ALERT_WEBHOOK_URL
        type: SECRET
      # SETTLED by Task 11 (2026-09-06): the backup daemon SHARES the app's
      # OBJECT_STORE_S3_* pair and takes only its BUCKET from a separate
      # variable, so a backup can never land in the attachment bucket by
      # accident. apps/server/src/ops/object-sink.ts reads exactly these
      # names.
      #
      # ALL FIVE ARE REQUIRED HERE, not just the credential pair. The earlier
      # revision of this block set only the two secrets plus the bucket, and
      # that was measured to be a silent wrong-cloud failure: with no
      # endpoint the SDK resolves Amazon's, and with no region it used to
      # default 'us-east-1', so the worker built a client for
      # https://s3.us-east-1.amazonaws.com/gisik-nokma-backups and would have
      # posted these Spaces credentials at AWS on the first night. Dev hides
      # it completely, because .env.example sets endpoint and region for
      # MinIO. s3TargetFromEnv now REFUSES to boot without the endpoint and
      # the region, naming them -- stricter than the attachment store's own
      # createObjectStoreFromEnv, deliberately, because a backup destination
      # has no local-disk fallback to degrade to.
      #
      # Same endpoint and region as the `server` component above (one Spaces
      # account, BLR1, two buckets), and path-style is 'false' for the same
      # reason it is there: Spaces wants subdomain-style addressing;
      # path-style is MinIO's shape, for local dev.
      - key: OBJECT_STORE_S3_ENDPOINT
        value: https://sgp1.digitaloceanspaces.com
      - key: OBJECT_STORE_S3_REGION
        value: sgp1
      - key: OBJECT_STORE_S3_FORCE_PATH_STYLE
        value: "false"
      - key: OBJECT_STORE_S3_ACCESS_KEY_ID
        type: SECRET
      - key: OBJECT_STORE_S3_SECRET_ACCESS_KEY
        type: SECRET
      # Trash series Plan 2 (2026-09-28, deviation D5): the permanent-delete
      # sweep deletes ATTACHMENT objects from this worker, so it needs the
      # attachment store -- without these two, createObjectStoreFromEnv defaults
      # to a LocalDiskStore (apps/server/src/attachments/store-config.ts) and
      # every purge's object delete would "succeed" against an empty local
      # folder. Measured 2026-09-28: the live worker had neither, so the 30-day
      # orphan sweep on this same worker has been listing that empty folder too.
      # THIS ALSO ARMS THE ORPHAN SWEEP AGAINST THE REAL BUCKET FOR THE FIRST
      # TIME -- run it with --dry-run first (docs/runbook.md, "Permanent-delete
      # sweep"). Same bucket as the server component's OBJECT_STORE_S3_BUCKET.
      - key: OBJECT_STORE
        value: s3
      - key: OBJECT_STORE_S3_BUCKET
        value: gisik-nokma-attachments
      - key: BACKUP_S3_BUCKET
        value: gisik-nokma-backups
      # The *_UTC schedule names stay UTC on purpose and are NOT affected by
      # TZ above: the schedule reads only setUTCHours/getUTCDay, so the dump
      # fires at the same absolute instant whatever the process zone is. Do
      # not "correct" these to IST -- the runbook translates them (21:00 UTC
      # = 02:30 IST), and a schedule that drifts with a container's locale
      # is the bug this shape avoids.
      - key: BACKUP_TIME_UTC
        value: "21:00"
      - key: LEDGER_EXPORT_TIME_UTC
        value: "22:00"
      - key: LEDGER_EXPORT_DOW_UTC
        value: "0"

# NO `zone:` on either domain (go-live day, 2026-09-22). `zone` tells App Platform to
# create the records in DigitalOcean DNS and to VERIFY that the apex's nameservers
# point at DigitalOcean; `artsourced.in` is served by Wix (ns14/ns15.wixdns.net),
# so that verification ran forever and the certificate steps never started. Without
# `zone`, App Platform expects two plain CNAMEs at the real DNS host and issues TLS
# once they resolve — which is what README step 5 has always said.
domains:
  - domain: pm.artsourced.in
    type: PRIMARY
  - domain: pm-api.artsourced.in
    type: ALIAS

ingress:
  rules:
    - match:
        authority:
          exact: pm-api.artsourced.in
      component:
        name: server
    # The API paths of the WEB host go to the server, ahead of the web
    # catch-all below. The browser dials the live-update WebSocket at the web
    # host (NEXT_PUBLIC_SERVER_URL) because that is the host that holds the
    # session cookie -- crossSubDomainCookies is deliberately off
    # (apps/server/src/auth/auth.ts), so a socket dialled at pm-api carries no
    # cookie and requireSession answers 401 at the upgrade (measured in
    # production 2026-09-23: every /v1/stream handshake 401 in ~1 ms). Next's
    # server cannot proxy the upgrade, so the edge must route it. /api/auth
    # rides along for the same reason: one host, one cookie.
    #
    # preserve_path_prefix is load-bearing: App Platform TRIMS the matched
    # prefix before forwarding by default (/v1/stream would reach the server
    # as /stream and 404). Rule order is precedence -- these must stay above
    # the authority-only web rule. Pinned by 13.1424.
    - match:
        authority:
          exact: pm.artsourced.in
        path:
          prefix: /v1
      component:
        name: server
        preserve_path_prefix: true
    - match:
        authority:
          exact: pm.artsourced.in
        path:
          prefix: /api/auth
      component:
        name: server
        preserve_path_prefix: true
    - match:
        authority:
          exact: pm.artsourced.in
      component:
        name: web
