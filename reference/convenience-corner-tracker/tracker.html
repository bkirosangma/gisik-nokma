<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convenience Corner — Project tracker</title>
<!--
  The viewer. It holds no data and no colour of its own.

  Data arrives from board.data.js, which is generated by tracker/tools/build_tracker.py
  from README.md, test-cases/, operations/ and design-system/tokens.json. Colour arrives
  in that same payload as CC_TRACKER.tokens and is written into CSS custom properties at
  boot, so this file is a third consumer of the one colour origin rather than a second
  copy of the palette. A unit test asserts no colour literal ever appears here, because
  the contrast scan globs design-system/ and would never catch one that did.

  A classic script tag rather than fetch or a module: Chrome blocks both on file: URLs,
  and file: is the only way this page is opened.
-->
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--r-surface-page);
    color: var(--r-text-primary);
    font-family: 'Avenir Next', Avenir, 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 28px 32px 80px; }

  .eyebrow {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 10.5px; font-weight: 600; letter-spacing: .13em;
    text-transform: uppercase; color: var(--r-text-action);
  }

  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.015em; margin: 8px 0 6px; }

  .lede { color: var(--r-text-secondary); max-width: 70ch; margin: 0 0 16px; font-size: 14.5px; }

  .statline {
    display: flex; gap: 18px; flex-wrap: wrap; align-items: center;
    font-size: 12px; color: var(--r-text-muted);
    padding: 10px 0; border-top: 1px solid var(--p-gray-300);
    border-bottom: 1px solid var(--p-gray-300); margin-bottom: 20px;
  }
  .statline b { color: var(--r-text-primary); font-variant-numeric: tabular-nums; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 22px; }
  .spacer { flex: 1; }

  .tabs { display: inline-flex; border: 1px solid var(--p-gray-300); border-radius: 8px; overflow: hidden; }
  .tabs button {
    appearance: none; border: 0; background: var(--r-surface-card); cursor: pointer;
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--r-text-secondary);
    padding: 7px 15px; border-right: 1px solid var(--p-gray-300);
  }
  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-pressed="true"] { background: var(--r-surface-brand); color: var(--r-text-on-brand); }

  .search {
    font: inherit; font-size: 13px; padding: 7px 11px; min-width: 230px;
    border: 1px solid var(--p-gray-300); border-radius: 8px;
    background: var(--r-surface-card); color: var(--r-text-primary);
  }
  .search::placeholder { color: var(--r-text-muted); }

  h2 {
    font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--r-text-muted); margin: 0 0 10px;
  }

  /* --- attention ---------------------------------------------------- */

  .attention {
    background: var(--r-surface-map); border: 1px solid var(--r-surface-highlight);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 24px;
  }
  .attention h2 { color: var(--r-text-action); margin-bottom: 12px; }
  .attention .empty { color: var(--r-text-secondary); font-size: 13px; }
  .att-row {
    display: flex; gap: 12px; align-items: baseline; padding: 7px 0;
    border-top: 1px solid var(--r-surface-warm); cursor: pointer;
  }
  .att-row:first-of-type { border-top: 0; }
  .att-row:hover .att-title { color: var(--r-text-action); }
  .att-title { flex: 1; font-size: 13.5px; }
  .att-lane {
    font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--r-text-muted); width: 92px; flex: none;
  }

  /* --- lanes / focus ------------------------------------------------ */

  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .lanes { grid-template-columns: 1fr; } }

  .lane-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 2px solid var(--r-surface-brand);
  }
  .lane-head h3 { font-size: 16px; font-weight: 700; margin: 0; }
  .lane-head .count { font-size: 12px; color: var(--r-text-muted); }

  .group-label {
    font-family: ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: var(--r-text-muted);
    margin: 16px 0 8px;
  }

  /* --- cards -------------------------------------------------------- */

  .card {
    background: var(--r-surface-card); border: 1px solid var(--p-gray-300);
    border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; cursor: pointer;
    border-left: 3px solid var(--p-gray-300);
  }
  .card:hover { border-color: var(--r-surface-brand); }
  .card.s-in-progress { border-left-color: var(--r-surface-brand); }
  .card.s-blocked { border-left-color: var(--r-feedback-error); }
  .card.s-next { border-left-color: var(--r-surface-highlight); }
  .card.s-done { border-left-color: var(--r-feedback-success); opacity: .62; }
  .card-top { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .card-title { font-size: 13.5px; line-height: 1.4; }
  .card.s-done .card-title { text-decoration: line-through; text-decoration-thickness: 1px; }
  .card-note {
    font-size: 12px; color: var(--r-text-secondary); margin-top: 5px;
    padding-left: 8px; border-left: 2px solid var(--r-surface-highlight);
  }

  .id {
    font-family: ui-monospace, Menlo, monospace; font-size: 10.5px;
    color: var(--r-text-muted); letter-spacing: .02em;
  }

  .chip {
    font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 20px; white-space: nowrap;
    background: var(--p-gray-100); color: var(--r-text-secondary);
  }
  .chip.warn { background: var(--p-yellow-200); color: var(--r-text-action); }
  .chip.hot {
    background: color-mix(in srgb, var(--r-feedback-error) 12%, var(--r-surface-card));
    color: var(--r-feedback-error);
  }
  .chip.go {
    background: color-mix(in srgb, var(--r-feedback-success) 12%, var(--r-surface-card));
    color: var(--r-feedback-success);
  }
  .chip.brand { background: var(--r-surface-brand); color: var(--r-text-on-brand); }

  .muted { color: var(--r-text-muted); font-size: 12px; }

  /* --- board -------------------------------------------------------- */

  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .board { grid-template-columns: repeat(2, 1fr); } }
  .col-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
    color: var(--r-text-secondary); padding-bottom: 7px; margin-bottom: 10px;
    border-bottom: 2px solid var(--p-gray-300);
  }
  .col-body { max-height: 68vh; overflow-y: auto; padding-right: 3px; }

  /* --- backlog ------------------------------------------------------ */

  .epic { margin-bottom: 26px; }
  .epic-head {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--p-gray-300);
  }
  .epic-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .row {
    display: flex; gap: 12px; align-items: baseline; padding: 7px 4px;
    border-bottom: 1px solid var(--p-gray-100); cursor: pointer;
  }
  .row:hover { background: var(--r-surface-map); }
  .row .id { width: 118px; flex: none; }
  .row .t { flex: 1; font-size: 13.5px; }
  .row.done .t { color: var(--r-text-muted); }

  /* --- detail overlay ----------------------------------------------- */

  .scrim {
    position: fixed; inset: 0; z-index: 40;
    background: color-mix(in srgb, var(--r-text-primary) 55%, transparent);
  }
  .sheet {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); z-index: 41;
    background: var(--r-surface-card); border-left: 1px solid var(--p-gray-300);
    overflow-y: auto; padding: 26px 30px 60px;
  }
  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .sheet h3 { font-size: 21px; font-weight: 700; margin: 10px 0 12px; line-height: 1.25; }
  .close {
    appearance: none; border: 0; background: none; cursor: pointer;
    font-size: 26px; line-height: 1; color: var(--r-text-action); padding: 0 4px;
  }
  .meta { width: 100%; border-collapse: collapse; margin: 14px 0 18px; }
  .meta th, .meta td {
    text-align: left; padding: 6px 0; font-size: 12.5px;
    border-bottom: 1px solid var(--p-gray-100); vertical-align: top;
  }
  .meta th { width: 132px; font-weight: 600; color: var(--r-text-muted); }
  .body {
    font-family: Charter, Georgia, 'Iowan Old Style', serif;
    font-size: 14.5px; line-height: 1.62; color: var(--r-text-primary);
  }
  .body p { margin: 0 0 11px; }
  .body ul { margin: 0 0 11px; padding-left: 20px; }
  .body code {
    font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
    background: var(--p-gray-100); padding: 1px 4px; border-radius: 4px;
  }
  .body a { color: var(--r-text-action); }
  .body ol { margin: 0 0 11px; padding-left: 22px; }
  .body ol li, .body ul li { margin: 0 0 6px; }
  .body h4, .body h5 {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 18px 0 8px; line-height: 1.3;
  }
  .body h4 { font-size: 15px; font-weight: 700; }
  .body h5 { font-size: 13px; font-weight: 600; color: var(--r-text-muted);
             letter-spacing: .02em; text-transform: uppercase; }
  .body blockquote {
    margin: 0 0 11px; padding: 8px 12px;
    border-left: 3px solid var(--p-gray-300); background: var(--r-surface-warm);
  }
  .body table.md { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 13px; }
  .body table.md th, .body table.md td {
    text-align: left; padding: 6px 8px; vertical-align: top;
    border-bottom: 1px solid var(--p-gray-100);
  }
  .body table.md th {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 11.5px; font-weight: 600; color: var(--r-text-muted);
    text-transform: uppercase; letter-spacing: .04em;
  }

  /* --- calendar: a month of only-true bars ------------------------------- */
  .cal-top { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 10px; }
  .cal-top h3 { font-size: 17px; font-weight: 700; }
  .cal-dows { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11px;
              color: var(--r-text-muted); text-transform: uppercase; letter-spacing: .05em;
              padding-bottom: 4px; }
  .cal-week { border-top: 1px solid var(--p-gray-100); padding: 2px 0 8px; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-day { font-size: 12px; color: var(--r-text-secondary); padding: 4px 6px; }
  .cal-day.dim { color: var(--p-gray-300); }
  .cal-day.today { color: var(--r-text-action); font-weight: 700; }
  .cal-day.today::after { content: ""; display: inline-block; width: 6px; height: 6px;
              border-radius: 50%; background: var(--r-surface-brand); margin-left: 4px; }
  .cal-lanes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-bar { font-size: 11.5px; line-height: 1.4; padding: 2px 8px; border-radius: 5px;
             background: var(--p-gray-100); color: var(--r-text-primary); cursor: pointer;
             overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .cal-bar.brand { background: var(--r-surface-brand); color: var(--r-text-on-brand); }
  .cal-bar.warn { background: var(--r-surface-highlight); }
  .cal-bar.hot { background: var(--r-feedback-error); color: var(--r-text-on-brand); }
  .cal-bar.go { background: var(--r-feedback-success); color: var(--r-text-on-brand); }
  .cal-bar.wait { background: repeating-linear-gradient(45deg, var(--r-surface-warm),
             var(--r-surface-warm) 6px, var(--p-gray-100) 6px, var(--p-gray-100) 12px);
             border: 1px dashed var(--p-gray-300); }
  .cal-mark { font-size: 11px; color: var(--r-text-muted); padding: 1px 6px; cursor: pointer;
              overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .cal-marks { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-more { border: 0; background: none; color: var(--r-text-action); font: inherit;
              font-size: 11.5px; cursor: pointer; padding: 2px 6px; }
  .cal-note { font-size: 12px; margin-top: 14px; color: var(--r-text-muted); }

  /* --- the ask: a question you can send without rewriting it -------------- */
  .ask { margin: 0 0 18px; border: 1px solid var(--p-gray-300); border-radius: 8px;
         background: var(--r-surface-warm); overflow: hidden; }
  .ask-head { display: flex; align-items: center; justify-content: space-between;
              gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--p-gray-300); }
  .ask-head span { font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
                   font-weight: 600; color: var(--r-text-muted); }
  .ask-copy { min-height: 32px; padding: 5px 12px; font: inherit; font-size: 12px;
              font-weight: 600; cursor: pointer; border-radius: 6px;
              border: 1px solid var(--r-text-action); color: var(--r-text-action);
              background: var(--r-surface-card); }
  .ask-copy[data-copied="1"] { border-color: var(--r-feedback-success);
                               color: var(--r-feedback-success); }
  .ask-text { margin: 0; padding: 12px; white-space: pre-wrap; font-size: 13px;
              line-height: 1.62; color: var(--r-text-primary); }
  .origin {
    display: inline-block; margin-top: 4px; font-family: ui-monospace, Menlo, monospace;
    font-size: 11.5px; color: var(--r-text-action);
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .missing { padding: 40px; text-align: center; color: var(--r-feedback-error); }
</style>
</head>
<body>
<div class="wrap"></div>

<script src="./board.data.js"></script>
<script>
(function () {
  "use strict";

  var wrap = document.querySelector(".wrap");
  var DATA = window.CC_TRACKER;

  if (!DATA) {
    wrap.innerHTML = '<div class="missing">board.data.js did not load. ' +
      'Run <code>python3 tracker/tools/build_tracker.py</code> from the repository root.</div>';
    return;
  }

  /* Colour: written from the payload, which read design-system/tokens.json. Nothing
     here picks a value; this file only decides which role goes where. */
  var root = document.documentElement;
  Object.keys(DATA.tokens.roles).forEach(function (role) {
    root.style.setProperty("--r-" + role.replace("/", "-"), DATA.tokens.roles[role]);
  });
  Object.keys(DATA.tokens.primitives).forEach(function (name) {
    root.style.setProperty("--p-" + name, DATA.tokens.primitives[name]);
  });

  var LANES = [
    { id: "claude", label: "Claude Code", blurb: "In the repository — roadmap and test cases" },
    { id: "kiro", label: "Yours", blurb: "Paperwork and people — nothing here needs code" }
  ];
  var COLUMNS = ["later", "next", "in-progress", "blocked", "done"];
  var COLUMN_LABEL = {
    "later": "Later", "next": "Next", "in-progress": "In progress",
    "blocked": "Blocked", "done": "Done"
  };
  var DAY = 86400000;

  var view = "focus";
  var lane = "all";
  var query = "";
  var openId = null;
  var calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  var calExpanded = {};   // weekKey -> true; reset on month nav

  /* ---- week arithmetic: week 1 comes from the README, today from the clock ---- */

  var week1 = new Date(DATA.week1 + "T00:00:00");
  var currentWeek = Math.floor((Date.now() - week1.getTime()) / (7 * DAY)) + 1;

  function daysSince(iso) {
    if (!iso) return null;
    return Math.floor((Date.now() - new Date(iso + "T00:00:00").getTime()) / DAY);
  }

  /* ---- attention: computed here, never authored ----
     The generator stays deterministic by emitting facts only; anything that depends
     on today's date has to be decided at read time or `--check` would fail daily. */

  function reasons(item) {
    var out = [];
    if (item.state === "blocked") out.push({ text: "blocked", tone: "hot" });
    if (item.state === "in-progress") {
      var days = daysSince(item.since);
      out.push(days === null
        ? { text: "in flight", tone: "brand" }
        : { text: days + "d in flight", tone: days > DATA.attention.stale_days ? "hot" : "brand" });
    }
    /* Weeks remaining, not the record's static slack. Slack is needed − clears and never
       changes, so a threshold on it either never fires or always does; what actually
       tightens as the project sits still is the gap between now and first needed. */
    if (!item.done && Number(item.meta.needed_week) > 0) {
      /* `needed_week: 0` is the records' way of saying "anytime" — STATUS.md prints it
         as such. Counting down to it would invent a deadline nobody set. */
      var left = Number(item.meta.needed_week) - currentWeek;
      if (left <= DATA.attention.slack_weeks) {
        out.push({ text: left + "w left", tone: left <= 2 ? "hot" : "warn" });
      }
    }
    if (!item.done && item.meta.clears_week && Number(item.meta.clears_week) < currentWeek &&
        (item.origin_status === "not-started" || item.origin_status === "not-asked")) {
      out.push({ text: "should have cleared W" + item.meta.clears_week, tone: "hot" });
    }
    return out;
  }

  var ITEMS = DATA.items.map(function (item) {
    var copy = Object.assign({}, item);
    copy.reasons = reasons(item);
    copy.haystack = (item.id + " " + item.title + " " + (item.note || "") + " " +
                     item.epic_label).toLowerCase();
    return copy;
  });
  var BY_ID = {};
  ITEMS.forEach(function (i) { BY_ID[i.id] = i; });

  function visible() {
    return ITEMS.filter(function (i) {
      if (lane !== "all" && i.lane !== lane) return false;
      if (query && i.haystack.indexOf(query) === -1) return false;
      return true;
    });
  }

  /* ---- tiny markdown, sized to what these origins actually contain: ----
     paragraphs, bold, italics, code, links, both list kinds, ##/### headings,
     blockquotes, and tables. Extended 2026-08-19 when the operations records
     outgrew the original prose-only set (test case 4.20) — the duns record's
     details table rendered as pipe soup and every record heading as literal
     "## …" text. If an origin gains a construct this misses, extend this,
     never the records' own markdown. */

  function esc(text) {
    return String(text).replace(/[&<>"]/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
    });
  }

  function markdown(text) {
    if (!text) return "";
    var blocks = esc(text).split(/\n{2,}/);
    return blocks.map(function (block) {
      var inline = block
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/gm, "$1<i>$2</i>");
      var lines = inline.split("\n").filter(function (l) { return l.trim(); });
      if (!lines.length) return "";

      // Table: a header row, a |---| separator, then body rows.
      if (lines.length >= 2 && /^\|/.test(lines[0]) && /^\|[\s\-|]+\|$/.test(lines[1])) {
        var cells = function (row) {
          return row.replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
        };
        var head = cells(lines[0]).map(function (c) { return "<th>" + c + "</th>"; }).join("");
        var rows = lines.slice(2).map(function (row) {
          return "<tr>" + cells(row).map(function (c) { return "<td>" + c + "</td>"; }).join("") + "</tr>";
        }).join("");
        return '<table class="md"><thead><tr>' + head + "</tr></thead><tbody>" + rows + "</tbody></table>";
      }

      // Heading: ## and deeper. The sheet title is an h3, so body headings sit below it.
      var heading = lines[0].match(/^(#{2,})\s+(.*)$/);
      if (heading) {
        var tag = heading[1].length === 2 ? "h4" : "h5";
        var rest = lines.slice(1);
        return "<" + tag + ">" + heading[2] + "</" + tag + ">" +
          (rest.length ? "<p>" + rest.join("<br>") + "</p>" : "");
      }

      // Blockquote (esc has already turned > into &gt;).
      if (lines.every(function (l) { return /^\s*&gt;/.test(l); })) {
        var quoted = lines.map(function (l) { return l.replace(/^\s*&gt;\s?/, ""); })
          .filter(function (l) { return l.trim(); });
        return "<blockquote>" + quoted.join("<br>") + "</blockquote>";
      }

      // Ordered list.
      if (lines.every(function (l) { return /^\s*\d+\.\s/.test(l); })) {
        var steps = lines.map(function (l) { return "<li>" + l.replace(/^\s*\d+\.\s/, "") + "</li>"; });
        return "<ol>" + steps.join("") + "</ol>";
      }

      // Unordered list.
      if (lines.every(function (l) { return /^\s*[-*]\s/.test(l); })) {
        var points = lines.map(function (l) { return "<li>" + l.replace(/^\s*[-*]\s/, "") + "</li>"; });
        return "<ul>" + points.join("") + "</ul>";
      }

      return "<p>" + lines.join("<br>") + "</p>";
    }).join("");
  }

  function chip(text, tone) {
    return '<span class="chip ' + (tone || "") + '">' + esc(text) + "</span>";
  }

  function card(item) {
    var chips = item.reasons.map(function (r) { return chip(r.text, r.tone); }).join("");
    return '<div class="card s-' + item.state + '" data-id="' + esc(item.id) + '">' +
      '<div class="card-top"><span class="id">' + esc(item.id) + "</span>" + chips + "</div>" +
      '<div class="card-title">' + esc(item.title) + "</div>" +
      (item.note ? '<div class="card-note">' + esc(item.note) + "</div>" : "") +
      "</div>";
  }

  /* ---- views ---- */

  function renderFocus(items) {
    var flagged = items.filter(function (i) { return !i.done && i.reasons.length; });
    flagged.sort(function (a, b) { return b.reasons.length - a.reasons.length; });

    var strip = '<section class="attention"><h2>Needs attention</h2>' +
      (flagged.length
        ? flagged.map(function (i) {
            return '<div class="att-row" data-id="' + esc(i.id) + '">' +
              '<span class="att-lane">' + (i.lane === "kiro" ? "Yours" : "Claude") + "</span>" +
              '<span class="att-title">' + esc(i.title) + "</span>" +
              i.reasons.map(function (r) { return chip(r.text, r.tone); }).join("") +
              "</div>";
          }).join("")
        : '<div class="empty">Nothing is blocked, in flight, or running short of slack. ' +
          "That is either calm or nothing has been flagged yet.</div>") +
      "</section>";

    var lanes = LANES.filter(function (l) { return lane === "all" || l.id === lane; })
      .map(function (l) {
        var mine = items.filter(function (i) { return i.lane === l.id; });
        var groups = ["in-progress", "next", "blocked"].map(function (state) {
          var some = mine.filter(function (i) { return i.state === state; });
          if (!some.length) return "";
          return '<div class="group-label">' + COLUMN_LABEL[state] + " · " + some.length + "</div>" +
            some.map(card).join("");
        }).join("");
        var later = mine.filter(function (i) { return i.state === "later"; }).length;
        var done = mine.filter(function (i) { return i.done; }).length;
        return "<section>" +
          '<div class="lane-head"><h3>' + l.label + "</h3>" +
          '<span class="count">' + mine.length + " items</span></div>" +
          '<div class="muted" style="margin-bottom:12px">' + l.blurb + "</div>" +
          (groups || '<div class="muted">Nothing flagged. ' + later +
                     " waiting in Later.</div>") +
          '<div class="group-label" style="margin-top:18px">' + later + " later · " +
          done + " done</div>" +
          "</section>";
      }).join("");

    return strip + '<div class="lanes">' + lanes + "</div>";
  }

  function renderBoard(items) {
    return '<div class="board">' + COLUMNS.map(function (state) {
      var some = items.filter(function (i) {
        return i.done ? state === "done" : i.state === state;
      });
      return "<section>" +
        '<div class="col-head"><span>' + COLUMN_LABEL[state] + "</span>" +
        "<span>" + some.length + "</span></div>" +
        '<div class="col-body">' +
        (some.length ? some.map(card).join("") : '<div class="muted">—</div>') +
        "</div></section>";
    }).join("") + "</div>";
  }

  function renderBacklog(items) {
    return DATA.epics.map(function (epic) {
      var some = items.filter(function (i) { return i.epic === epic.id; });
      if (!some.length) return "";
      var open = some.filter(function (i) { return !i.done; }).length;
      return '<section class="epic"><div class="epic-head"><h3>' + esc(epic.label) + "</h3>" +
        '<span class="muted">' + open + " open of " + some.length + "</span></div>" +
        some.map(function (i) {
          return '<div class="row ' + (i.done ? "done" : "") + '" data-id="' + esc(i.id) + '">' +
            '<span class="id">' + esc(i.id) + "</span>" +
            '<span class="t">' + esc(i.title) + "</span>" +
            chip(COLUMN_LABEL[i.done ? "done" : i.state],
                 i.done ? "go" : i.state === "blocked" ? "hot" :
                 i.state === "in-progress" ? "brand" : i.state === "next" ? "warn" : "") +
            "</div>";
        }).join("") + "</section>";
    }).join("");
  }


  /* ---- calendar: only what is true gets a bar (spec 2026-08-19) ----
     Sources: authored start/due from board.json; real started/ended from the
     records; an open wait runs from its real start to the record's clears-week
     expectation (or today, whichever is later, so a late wait visibly
     overruns); needed_week becomes a marker on the last day of that week.
     Undated items simply do not appear — a calendar that invented dates for
     them would be lying, which is the no-countdown rule a second time. */

  function weekEndDate(n) { return new Date(week1.getTime() + (7 * n - 1) * DAY); }
  function isoDate(s) { return new Date(s + "T00:00:00"); }

  function calendarSpans(items) {
    var spans = [], markers = [];
    items.forEach(function (item) {
      if (item.start || item.due) {
        spans.push({ item: item, from: isoDate(item.start || item.due),
                     to: isoDate(item.due || item.start), kind: "plan" });
      }
      if (item.started) {
        var from = isoDate(item.started);
        if (item.ended) {
          spans.push({ item: item, from: from, to: isoDate(item.ended), kind: "real" });
        } else {
          var cw = item.meta && item.meta.clears_week;
          var today = new Date(); today.setHours(0, 0, 0, 0);
          var expect = cw && /^\d+$/.test(String(cw)) ? weekEndDate(+cw) : today;
          spans.push({ item: item, from: from,
                       to: new Date(Math.max(expect.getTime(), today.getTime())),
                       kind: "wait" });
        }
      }
      var nw = item.meta && item.meta.needed_week;
      if (nw && /^\d+$/.test(String(nw)) && !item.done) {
        markers.push({ item: item, on: weekEndDate(+nw) });
      }
    });
    return { spans: spans, markers: markers };
  }

  function renderCalendar(items) {
    var data = calendarSpans(items);
    var first = calMonth, month = first.getMonth();
    var gridStart = new Date(first.getFullYear(), month, 1 - ((first.getDay() + 6) % 7));
    var last = new Date(first.getFullYear(), month + 1, 0);
    var weeks = Math.ceil(((last - gridStart) / DAY + 1) / 7);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var monthName = first.toLocaleDateString("en-GB", { month: "long", year: "numeric" });

    var head = '<div class="cal-top"><h3>' + esc(monthName) + "</h3>" +
      '<div class="tabs"><button data-cal-nav="prev" aria-label="Previous month">&#8249;</button>' +
      '<button data-cal-nav="today">Today</button>' +
      '<button data-cal-nav="next" aria-label="Next month">&#8250;</button></div></div>' +
      '<div class="cal-dows">' + ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
        .map(function (d) { return "<span>" + d + "</span>"; }).join("") + "</div>";

    var rows = [];
    for (var w = 0; w < weeks; w++) {
      var weekStart = new Date(gridStart.getTime() + w * 7 * DAY);
      var weekStop = new Date(weekStart.getTime() + 6 * DAY);
      var cells = "";
      for (var d = 0; d < 7; d++) {
        var day = new Date(weekStart.getTime() + d * DAY);
        cells += '<div class="cal-day' + (day.getMonth() !== month ? " dim" : "") +
          (day.getTime() === today.getTime() ? " today" : "") + '">' + day.getDate() + "</div>";
      }
      var lanes = [];
      data.spans.filter(function (s) { return s.from <= weekStop && s.to >= weekStart; })
        .sort(function (a, b) { return a.from - b.from; })
        .forEach(function (s) {
          var lane = 0;
          while (lanes[lane] && lanes[lane].some(function (o) {
            return s.from <= o.to && s.to >= o.from;
          })) lane++;
          (lanes[lane] = lanes[lane] || []).push(s);
        });
      var weekKey = "w" + w;
      var shown = calExpanded[weekKey] ? lanes.length : Math.min(lanes.length, 3);
      var bars = "";
      for (var L = 0; L < shown; L++) {
        bars += lanes[L].map(function (s) {
          var c1 = Math.max(0, Math.round((s.from - weekStart) / DAY));
          var c2 = Math.min(6, Math.round((s.to - weekStart) / DAY));
          var tone = s.kind === "wait" ? "wait"
            : s.item.done ? "go"
            : s.item.state === "blocked" ? "hot"
            : s.item.state === "in-progress" ? "brand"
            : s.item.state === "next" ? "warn" : "";
          var label = (s.kind === "wait" ? "waiting · " : "") + s.item.title;
          return '<div class="cal-bar ' + tone + '" data-id="' + esc(s.item.id) +
            '" style="grid-column:' + (c1 + 1) + "/" + (c2 + 2) +
            ';grid-row:' + (L + 1) + '" title="' + esc(s.item.id) + '">' +
            esc(label) + "</div>";
        }).join("");
      }
      var hidden = lanes.length - shown;
      var marks = data.markers
        .filter(function (m) { return m.on >= weekStart && m.on <= weekStop; })
        .map(function (m) {
          var col = Math.round((m.on - weekStart) / DAY);
          return '<div class="cal-mark" data-id="' + esc(m.item.id) +
            '" style="grid-column:' + (col + 1) + "/" + (col + 2) + '">&#9670; needed W' +
            esc(m.item.meta.needed_week) + " · " + esc(m.item.title) + "</div>";
        }).join("");
      rows.push('<div class="cal-week"><div class="cal-days">' + cells + "</div>" +
        (bars ? '<div class="cal-lanes" style="grid-template-rows:repeat(' +
          Math.max(shown, 1) + ',minmax(20px,auto))">' + bars + "</div>" : "") +
        (hidden > 0 ? '<button class="cal-more" data-cal-expand="' + weekKey + '">+' +
          hidden + " more</button>" : "") +
        (marks ? '<div class="cal-marks">' + marks + "</div>" : "") + "</div>");
    }
    var dated = data.spans.length + data.markers.length;
    return '<section class="cal">' + head + rows.join("") +
      '<p class="muted cal-note">' + dated + " dated element(s) across all months. Items " +
      "with no dates in any origin are not shown — a calendar that invented them would be " +
      "lying. Schedule an item by giving it start/due in tracker/board.json.</p></section>";
  }

  var META_LABEL = {
    clears_week: "Clears", needed_week: "First needed", slack: "Slack", cost: "Cost",
    lead_time: "Lead time", counterparty: "Counterparty", who: "Who",
    reference: "Reference", answer: "Answer", closes: "Closes"
  };

  function renderSheet() {
    var item = BY_ID[openId];
    if (!item) return "";
    var rows = Object.keys(META_LABEL).filter(function (k) { return item.meta[k]; })
      .map(function (k) {
        var value = item.meta[k];
        if (k === "clears_week" || k === "needed_week") value = "W" + value;
        if (k === "slack") value = value + " weeks";
        return "<tr><th>" + META_LABEL[k] + "</th><td>" + esc(value) + "</td></tr>";
      });
    rows.unshift("<tr><th>State</th><td>" +
      esc(COLUMN_LABEL[item.done ? "done" : item.state]) +
      (item.done ? " — recorded at the origin" : "") + "</td></tr>");
    rows.unshift("<tr><th>Epic</th><td>" + esc(item.epic_label) + "</td></tr>");
    if (item.blocked_by) {
      var blocker = BY_ID[item.blocked_by];
      rows.push("<tr><th>Blocked by</th><td>" + esc(item.blocked_by) + " — " +
        esc(blocker ? blocker.title : "") + "</td></tr>");
    }
    if (item.since) rows.push("<tr><th>In flight since</th><td>" + esc(item.since) + "</td></tr>");
    if (item.note) rows.push("<tr><th>Note</th><td>" + esc(item.note) + "</td></tr>");

    return '<div class="scrim" data-close="1"></div><aside class="sheet">' +
      '<div class="sheet-top"><div>' +
      '<span class="id">' + esc(item.id) + "</span>" +
      '<div class="chips">' + item.reasons.map(function (r) {
        return chip(r.text, r.tone);
      }).join("") + "</div></div>" +
      '<button class="close" data-close="1" aria-label="Close">×</button></div>' +
      "<h3>" + esc(item.title) + "</h3>" +
      '<table class="meta"><tbody>' + rows.join("") + "</tbody></table>" +
      (item.ask_text
        ? '<div class="ask"><div class="ask-head"><span>Send this</span>' +
          '<button class="ask-copy" data-copy="1">Copy</button></div>' +
          '<p class="ask-text">' + esc(item.ask_text) + "</p></div>"
        : "") +
      '<div class="body">' + markdown(item.body) + "</div>" +
      '<a class="origin" href="../' + esc(item.origin_file) + '">' +
      esc(item.origin_file) + " ↗</a></aside>";
  }

  function render() {
    var items = visible();
    var open = ITEMS.filter(function (i) { return !i.done; }).length;
    var flight = ITEMS.filter(function (i) { return i.state === "in-progress" && !i.done; }).length;
    var watch = ITEMS.filter(function (i) { return !i.done && i.reasons.length; }).length;

    wrap.innerHTML =
      '<div class="eyebrow">Convenience Corner · Project tracker</div>' +
      "<h1>What is actually happening</h1>" +
      '<p class="lede">Every item here is read from the file that owns it — the README ' +
      "roadmap, <code>test-cases/</code> and <code>operations/</code>. This page adds only " +
      "what none of them can say: what is in flight, what is stuck, and what to look at " +
      "first. Nothing is marked done here; done is recorded at the origin.</p>" +
      '<div class="statline"><span>Week <b>' + currentWeek + "</b> of the schedule</span>" +
      "<span><b>" + open + "</b> open</span>" +
      "<span><b>" + flight + "</b> in flight</span>" +
      "<span><b>" + watch + "</b> needing attention</span>" +
      "<span><b>" + ITEMS.length + "</b> tracked across <b>" + DATA.epics.length +
      "</b> epics</span></div>" +
      '<div class="toolbar"><div class="tabs">' +
      ["focus", "board", "backlog", "calendar"].map(function (v) {
        return '<button data-view="' + v + '" aria-pressed="' + (view === v) + '">' +
          v.charAt(0).toUpperCase() + v.slice(1) + "</button>";
      }).join("") + "</div>" +
      '<div class="tabs">' +
      [["all", "Both"], ["claude", "Claude Code"], ["kiro", "Yours"]].map(function (pair) {
        return '<button data-lane="' + pair[0] + '" aria-pressed="' + (lane === pair[0]) +
          '">' + pair[1] + "</button>";
      }).join("") + "</div>" +
      '<div class="spacer"></div>' +
      '<input class="search" type="search" placeholder="Filter by id, title or note…" ' +
      'value="' + esc(query) + '">' +
      "</div>" +
      (view === "focus" ? renderFocus(items)
        : view === "board" ? renderBoard(items)
        : view === "calendar" ? renderCalendar(items) : renderBacklog(items)) +
      renderSheet();

    document.body.style.overflow = openId ? "hidden" : "";

    var box = wrap.querySelector(".search");
    if (query) { box.focus(); box.setSelectionRange(query.length, query.length); }
  }

  wrap.addEventListener("click", function (event) {
    var nav = event.target.closest("[data-cal-nav]");
    if (nav) {
      var dir = nav.getAttribute("data-cal-nav");
      calExpanded = {};
      calMonth = dir === "today"
        ? new Date(new Date().getFullYear(), new Date().getMonth(), 1)
        : new Date(calMonth.getFullYear(), calMonth.getMonth() + (dir === "next" ? 1 : -1), 1);
      return render();
    }
    var expand = event.target.closest("[data-cal-expand]");
    if (expand) { calExpanded[expand.getAttribute("data-cal-expand")] = true; return render(); }

    var tab = event.target.closest("[data-view]");
    if (tab) { view = tab.getAttribute("data-view"); openId = null; return render(); }

    var laneTab = event.target.closest("[data-lane]");
    if (laneTab) { lane = laneTab.getAttribute("data-lane"); return render(); }

    if (event.target.closest("[data-close]")) { openId = null; return render(); }

    /* Copy the ask. This page is opened over file://, where the async clipboard
       API is not reliably available -- so try it, and fall back to the old
       execCommand path rather than failing silently on the one control whose
       entire purpose is to put text somewhere else. */
    var copyBtn = event.target.closest("[data-copy]");
    if (copyBtn) {
      var text = copyBtn.closest(".ask").querySelector(".ask-text").textContent;
      var done = function () {
        copyBtn.textContent = "Copied";
        copyBtn.setAttribute("data-copied", "1");
        setTimeout(function () {
          copyBtn.textContent = "Copy";
          copyBtn.removeAttribute("data-copied");
        }, 2000);
      };
      var fallback = function () {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        if (ok) { done(); } else { copyBtn.textContent = "Select and copy"; }
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, fallback);
      } else {
        fallback();
      }
      return;
    }

    if (event.target.closest(".sheet")) return;

    var row = event.target.closest("[data-id]");
    if (row) { openId = row.getAttribute("data-id"); return render(); }
  });

  wrap.addEventListener("input", function (event) {
    if (!event.target.classList.contains("search")) return;
    query = event.target.value.trim().toLowerCase();
    render();
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && openId) { openId = null; render(); }
  });

  render();
})();
</script>
</body>
</html>
