name: ci

# The independent-CI precondition for the coordination doc's auto-merge
# protocol (docs/superpowers/plans/2026-08-20-00-series-coordination.md,
# "Autonomous execution protocol", ruling 1): without a check that isn't a
# lane's own word, "green" is self-certification. This file started as one
# `gate` job (see git history for that version and why each split below was
# deferred). Plan 11 Task 14 owns turning it into the split pipeline and
# sharding the server suite -- this is that split, scoped to what actually
# exists on `main` today. `gate` (bottom of this file) is still the single
# check name the auto-merge precondition and any branch protection rule
# reads; everything above it is real parallel work, aggregated there.
#
# What the plan's own six-job list (lint -> typecheck -> unit -> fixtures ->
# dual-client -> e2e) still can't have, and why -- unchanged from the prior
# version, still true at this task's own measurement:
#   - lint: no root "lint" script exists yet (Plans 1-2 only wired
#     build/test/typecheck). `check-env` (below) is the env-contract gate
#     that plan text hangs off a future lint job; it runs as its own job,
#     not gated on lint existing.
#   - fixtures (client half): `packages/app-core` exists but does not yet run
#     the shared rule-engine fixture harness against a client build --
#     `test:fixtures` is not a script anywhere in this repo. Plan 6's own
#     fixtures task owns this exclusion. The server-side half already runs
#     as part of `packages/rule-engine`'s own `test` script, which the
#     `other-tests` job below already executes via `turbo run test`.
#   - dual-client: Plan 10's harness (`test:dual-client`) doesn't exist.
#
#     ON THE ROOT `package.json` SCRIPTS THIS TASK'S OWN FILES: BLOCK NAMES
#     ("Modify: root package.json (scripts test:fixtures, test:dual-client)"):
#     deliberately NOT added. The plan's own executor note anticipates this --
#     "open those packages as landed, confirm the package names and the
#     fixture-runner invocation, and correct these two lines to the real
#     commands" -- but there is no real command to correct them TO yet:
#     `packages/app-core` has no `--project fixtures` vitest config, and
#     `apps/server/test/dual-client/` does not exist. Adding either script
#     today would point at a path that isn't there, which fails the moment
#     anyone runs it -- not silently, but also not usefully, and a script
#     that exists in package.json reads as "wired up" even when calling it
#     always errors. Left out rather than stubbed; add both, and the CI
#     steps that call them, in the same commit that lands the artifact each
#     one actually names (Plan 6's client fixture harness; Plan 10's
#     dual-client harness). Until then, this is the honest state: neither
#     cross-build fixture agreement nor a dual-client sync check runs in CI.
#     The rule-engine fixture suite's server-side half is not a substitute
#     for either -- it proves the server build agrees with itself, not with
#     a client build, and it is not what dual-client means.
#   - the interim-plumbing gate: guards Plan 10's own marked shortcuts
#     (`Interim session plumbing until Plan 6`, `EXPO_PUBLIC_DEV_*`), which
#     exist only in plan PROSE (docs/superpowers/plans/...), not in any
#     tracked file under apps/, packages/, or scripts/ -- a `git grep` for
#     either marker outside docs/ returns nothing. A gate wired against
#     markers that don't exist yet would pass vacuously, which is worse than
#     not having it: it would read as verification of a property nothing
#     has shipped. Add it when (if) Plan 10 actually ships a shortcut.
# What IS new here: the server suite (90 files, the critical path) is
# sharded across `server-tests`' matrix instead of running serially inside
# one job; `check:tasks` (scripts/check-task-ledger.mjs) is wired as its own
# job, independent of the docs-only skip, because the ledger it validates
# lives under docs/lanes/ and a ledger-only PR is exactly a docs-only diff --
# the one case where "the gate was skipped" must not also mean "the ledger
# was never checked"; and a guard against a skipIf'd suite silently
# contributing zero tests (see `check-no-silent-skips.mjs`), wired ahead of
# its first real trigger -- Plan 11 T11/T12 add
# `describe.skipIf(!pgDumpAvailable())` around the restore-drill suite, and
# this is what turns a missing pg_dump binary into a loud CI failure instead
# of a quietly-empty green suite.
# WHERE THIS RUNS: the release -> `main` PR, and `workflow_dispatch`. Nothing else.
# (Owner, 2026-09-23: *"can we not run CI for the dev PR merges, and only have CI run on
# merges to main?"*; narrowed 2026-10-02: *"CI to be run only on merges to main"*, then,
# choosing between options, "Only the release PR into main" -- CI runs on the release PR,
# BEFORE the merge deploys, and the push-to-`main` run is dropped.)
#
# This repo is PRIVATE, so every minute here is billed, and on 2026-09-22 the account
# stopped being able to start jobs at all ("recent account payments have failed or your
# spending limit needs to be increased"). Cutting the volume is the right instinct: the
# dev PRs are nearly all of it, since the release plan's task branches each ran the full
# fourteen checks including `e2e` and `viewport`.
#
# But "run it on merges to main" read literally would put CI AFTER the thing it is
# supposed to guard. A merge to `main` fires App Platform's `deploy_on_push`
# (`deploy/do/app.yaml`, three components), so by the time a `push: main` job starts,
# production is already deploying. That is a post-mortem, not a gate -- which is why the
# owner chose the release PR, and why there is NO `push` trigger below: a push-to-`main`
# run would be a second run of a tree the PR run already proved, started after the deploy.
#
# The filter is on the PULL REQUEST's BASE, which is what makes this work:
# `pull_request.branches` matches the branch a PR is merging INTO, never the one it comes
# from. A PR from a task branch into `release/<date>` therefore runs nothing, and the
# release -> `main` PR -- the only one that decides a production deploy -- runs
# everything, BEFORE the merge. `main` is unprotected and nothing server-side stops a
# direct push; that is covered by the repo's rule (never push to `main`), not by a CI run
# that could only report on a deploy already under way.
#
# `workflow_dispatch` is here so a release branch can still be run on demand -- before a
# release cut, when a dev PR is big enough to be worth the minutes, or to prove a CI repair
# on its own branch -- without editing this file to get it.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Shared by every job below so the Postgres connection string and the
  # docs-only skip's meaning are identical wherever they're read.
  TEST_DATABASE_ADMIN_URL: postgres://gisik:gisik@localhost:54329/postgres

jobs:
  # Decides once, for every other job, whether this diff can possibly change
  # a test outcome. Unchanged in substance from the single-job version:
  # ONLY docs/** is treated as inert; an empty changed-file list is treated
  # as "detection learned nothing" and takes the safe (full-gate) branch,
  # never as evidence of a docs-only change (a wrong merge base once made a
  # real 82-file change report zero files).
  scope:
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff below is against the merge base, which needs history.
          fetch-depth: 0

      - id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            # workflow_dispatch has no base: detection learns nothing and
            # the full gate runs (the empty-base branch just below).
            base=""
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no usable base sha -- running the full gate"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "--- files changed against $base ---"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "empty file list -- detection learned nothing, running the full gate"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          outside_docs="$(echo "$changed" | grep -v '^docs/' || true)"
          if [ -z "$outside_docs" ]; then
            echo "DOCS-ONLY CHANGE: every changed path is under docs/."
            echo "build/typecheck/test are SKIPPED for this run (see the"
            echo "individual job summaries). This does NOT mean the suite"
            echo "passed -- only check-tasks (the ledger gate) still runs."
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "--- paths outside docs/, running the full gate ---"
            echo "$outside_docs"
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # The env contract gate (Plan 11 Task 6): fails if code reads a
  # configuration variable `.env.example` does not document. Reads source
  # text only, needs no build -- its own job so a stray variable is named in
  # seconds rather than after a build+test run.
  #
  # Also runs check-skipif-coverage.mjs: `server-tests`' silent-skip guard
  # only checks apps/server/test/, so a `.skipIf(` guard landing in any other
  # package (or even inside apps/server outside that prefix) is covered by
  # NOTHING. Same class of gate as check:env -- reads source text only, no
  # build, so a guard appearing somewhere uncovered is named in seconds
  # rather than passing silently through a job that never looks for it.
  #
  # And check-case-ids.mjs: multiple test-cases/NN-*.md files use more than
  # one id-line style (bare, bold, marker-first) in the same section, and a
  # recount that only recognises one style reports "zero duplicates" through
  # a collision it structurally cannot see -- measured (case ids in §12).
  # This script self-tests against scripts/fixtures/check-case-ids-fixture.md
  # BEFORE trusting a result from the real files, because a matcher that
  # returns zero on every real file is otherwise indistinguishable from one
  # that never fires at all -- measured too, while building it: an earlier
  # regex greedily swallowed a compound id line (`**7.1, 7.2 — ...`) whole as
  # its "marker" and misreported the wrong number as duplicated.
  check-env:
    needs: scope
    if: needs.scope.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:env
      - run: node scripts/check-skipif-coverage.mjs
      - run: node scripts/check-case-ids.mjs

      # NINE `scripts/check-*.mjs` EXIST AND THIS WORKFLOW RUNS EIGHT OF THEM.
      # The one it does not run is `scripts/check-db-timezone.mjs` (`pnpm
      # check:db-tz`), and the absence is a DECISION rather than an oversight --
      # recorded here, beside the checkers, because a reader sweeping this file
      # finds every sibling check either wired or accounted for and this one
      # script with no caller anywhere (F8, 2026-09-21). It asserts the PROVISIONED database's OWN default
      # timezone through a bare client that sets no startup option, so it needs
      # `DATABASE_URL` and exits 2 without one -- and no job here carries a
      # database it should point at. This job has none. The `server-tests`
      # service below does, but only approximates IST through a `TZ` its own
      # comment calls best-effort, so a step there would assert a property that
      # job does not guarantee and would go red on a CI-only difference. It runs
      # where the property exists, and `docs/runbook.md` "Time" names the three
      # occasions: after provisioning, after a database restore, and after
      # managed-database maintenance. (`check:ctl` is the one other package
      # script with no step here; it is not one of the nine, which are the
      # `scripts/check-*.mjs` files. `check:help` runs `scripts/help-content.mjs`
      # and is likewise outside that nine.)

  # The task-ledger gate (scripts/check-task-ledger.mjs): every task in every
  # plan has one ledger row, and every row claiming `done` names a merge
  # commit reachable from origin/main. Deliberately NOT gated on
  # `code_changed`: the ledger it reads lives under docs/lanes/, so a
  # ledger-only promotion PR is exactly a docs-only diff by the `scope` job's
  # own rule -- the one case this job exists to still cover. Needs full
  # history (the script resolves `origin/main` and walks merge-base
  # ancestry); no pnpm install -- the script imports only node builtins.

  # ITS OWN JOB, INDEPENDENT OF THE DOCS-ONLY SKIP -- the same reason
  # `check-tasks` is, and for a sharper version of the same hazard.
  #
  # This check first landed as a step inside `check-env`, which carries
  # `if: needs.scope.outputs.code_changed == 'true'`. `docs/runbook.md` is
  # under `docs/`, so a PR that edits ONLY the runbook is a docs-only diff:
  # `check-env` skipped, this check never ran, and `gate` counts `skipped` as
  # success. That is precisely the diff shape that introduces a ghost command --
  # and the shape both of the defects this check was written for actually had.
  # A check that is skipped on exactly the change class it guards is not a
  # check. Found by review, not by CI, because CI could not have found it.
  check-runbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: every command the runbook names must resolve
        run: pnpm check:runbook

  # ITS OWN JOB, INDEPENDENT OF THE DOCS-ONLY SKIP -- the same reason
  # `check-runbook` just above is, guarding the same shape of hazard one
  # level up. `test-cases/NN-*.md` lives outside `docs/`, so `scope`'s own
  # `code_changed` rule does not even try to call a catalogue-only edit
  # docs-only today -- but that is `scope`'s CURRENT boundary, not a promise,
  # and this job's own subject (does every ✅ still have a live citation) is
  # unrelated to whichever paths `scope` happens to treat as inert. Wiring
  # this behind `needs: scope` + `if: code_changed == 'true'` would make its
  # correctness depend on that boundary never moving to include
  # `test-cases/` -- exactly the kind of skip condition `check-runbook`
  # was pulled out of `check-env` for. So it always runs, unconditionally,
  # for the same reason `check-runbook` does: cheap (reads source text and
  # two small JSON/markdown fixtures, no build), and a check gated on the
  # change class it guards is not a check.
  check-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: every checked (✅) case id must still be cited by a live test
        run: pnpm check:citations

  # The manual and FAQ are GENERATED into `packages/app-core` from `docs/*.md`,
  # and the apps render the generated module. Without this job the generated copy
  # can drift from its source silently — users reading an old manual while the
  # document says something else, with no symptom until somebody follows an
  # instruction that stopped being true. Reads source text only; no database, no
  # build, same class of gate as check:env.
  #
  # `--check` also runs the parser's own self-test (planted defects included)
  # before it certifies anything, so a broken parser fails here rather than
  # quietly producing a plausible wrong document.
  check-help:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: the in-app manual and FAQ must match the documents they are generated from
        run: pnpm check:help

  check-tasks:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-task-ledger.mjs
        env:
          # Enables the reverse-drift section (merged PRs no ledger row
          # cites) to actually query the API instead of degrading to
          # "unknown" -- the script already treats a missing/unauthenticated
          # `gh` as non-fatal (see its own try/catch), so this is an
          # improvement, not a requirement.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ITS OWN JOB, on the same terms as `check-tasks` just above: it needs real
  # git history AND a resolved base ref, which no other job here does.
  #
  # The hazard it guards is the one class of migration defect that every other
  # gate is structurally blind to. A migration numbered below one already
  # applied can never run -- node-pg-migrate's `checkOrder` refuses it as
  # "preceding already run migration" -- but a FRESH database applies every
  # migration cleanly in numerical order, so the full server suite passes on
  # the broken tree. Measured, not reasoned: PR #459 added
  # `1789300000000_proj-tickets-reopened-at.sql` while `1789400000000` was
  # already on main, 1,548 tests stayed green, and the running stack went down
  # until commit 73c40ea3 renamed it.
  #
  # `fetch-depth: 0` is required and is not incidental: the check compares
  # today's migrations directory against the base ref's, and a shallow clone
  # has no base ref to compare against. It FAILS LOUDLY rather than passing
  # vacuously when the ref cannot be resolved, which is the whole reason the
  # baseline is refetchable rather than assumed.
  #
  # THE BASE IS THE PULL REQUEST'S OWN, NOT `main` -- found by review, and the
  # difference is a real false accept rather than a nicety. Measured in a
  # scratch repo: a branch whose base adds `1790000000000` and which itself adds
  # `1789600000000` is ACCEPTED against `origin/main` (max `1789500000000`) and
  # REFUSED against its actual base. When both merge, the file set holds
  # `1789600000000` while the applied list already holds `1790000000000`, so
  # checkOrder throws at container start -- the exact outage this job exists to
  # prevent. 14 of the last 400 merges here were based on a non-main branch, so
  # the shape is used in this repo, not hypothetical. `github.base_ref` is set
  # only for `pull_request`; on a `workflow_dispatch` the fallback is `main`, so a
  # manual run of a release branch is checked against what is on `main` today.
  check-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: no migration may be numbered below one already on the base ref
        run: node scripts/check-migration-order.mjs --base origin/${{ github.base_ref || 'main' }}

  # Builds every package once and persists turbo's cache for the jobs below.
  #
  # THE SAFETY PROPERTY THAT MAKES THIS OK, carried over unchanged: the
  # controller's own pre-merge gate runs `--force` and so never consults this
  # cache. A cache hit here means "this exact input hash already passed
  # somewhere"; the merge decision still rests on an uncached run.
  build:
    needs: scope
    if: needs.scope.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build

  typecheck:
    needs: [scope, build]
    # Spelled out explicitly rather than relied on implicitly: whether
    # GitHub Actions' own default needs-success gating would already prevent
    # this job from running against a genuinely failed `build` is disputed
    # and was not verified against a real run for this file. Writing
    # `needs.build.result == 'success'` here removes the ambiguity rather
    # than resting on an assumption either way.
    if: needs.scope.outputs.code_changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Same key as `build` -- this job runs after it, so the cache `build`
      # just saved is what gets restored, and `turbo run typecheck` replays
      # its outputs instead of rebuilding from source.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck

  # The critical path (90 files, ~270s serially) sharded across a matrix.
  # Postgres client tools are installed here, pinned to the SERVER's major
  # version (16), not whatever ubuntu-latest's own default resolves to --
  # measured locally: a v18 pg_dump against this server's v16 writes an
  # archive a v16 pg_restore cannot always read. Not yet exercised by any
  # test on `main` (Plan 11 T11/T12, which add the restore-drill suite that
  # needs these binaries, haven't landed), but installing it now means the
  # binaries are already present the day that suite arrives instead of it
  # silently skipping on its first CI run.
  server-tests:
    needs: [scope, build]
    # Spelled out explicitly rather than relied on implicitly: whether
    # GitHub Actions' own default needs-success gating would already prevent
    # this job from running against a genuinely failed `build` is disputed
    # and was not verified against a real run for this file. Writing
    # `needs.build.result == 'success'` here removes the ambiguity rather
    # than resting on an assumption either way.
    if: needs.scope.outputs.code_changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gisik
          POSTGRES_PASSWORD: gisik
          POSTGRES_DB: gisik_nokma
          # Best-effort container-level parity with docker-compose.yml's
          # `command: ["postgres", "-c", "timezone=Asia/Kolkata"]` (service
          # containers have no `command:` override). Doesn't need to be exact:
          # the owner's IST decision is enforced at the application layer --
          # apps/server/test/helpers/db.ts ALTERs each per-test database's
          # timezone, and apps/server/src/db.ts's createPool sets it for the
          # app pool. Both run unmodified here.
          TZ: Asia/Kolkata
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U gisik" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - name: install postgresql-client-16 (pinned to the server's major version)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          # The whole point of pinning is a v16 archive-writer; a green apt
          # install doesn't prove that's what's actually on PATH afterward.
          pg_dump --version
          pg_dump --version | grep -q ' 16\.' || {
            echo "pg_dump did not resolve to major version 16 -- the pin failed silently"
            exit 1
          }
      - name: server suite, shard ${{ matrix.shard }}/4
        working-directory: apps/server
        run: >-
          pnpm exec vitest run --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=json
          --outputFile.json=/tmp/vitest-server-shard-${{ matrix.shard }}.json
      - name: fail loud on a fully-skipped skipIf suite (this shard)
        run: node scripts/check-no-silent-skips.mjs /tmp/vitest-server-shard-${{ matrix.shard }}.json

  # Everything that isn't @gisik-nokma/server: domain, rule-engine, ui,
  # app-core, editor, sync-client, web, desktop. Runs on the same restored
  # cache as `server-tests`, in parallel with it.
  other-tests:
    needs: [scope, build]
    # Spelled out explicitly rather than relied on implicitly: whether
    # GitHub Actions' own default needs-success gating would already prevent
    # this job from running against a genuinely failed `build` is disputed
    # and was not verified against a real run for this file. Writing
    # `needs.build.result == 'success'` here removes the ambiguity rather
    # than resting on an assumption either way.
    if: needs.scope.outputs.code_changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gisik
          POSTGRES_PASSWORD: gisik
          POSTGRES_DB: gisik_nokma
          TZ: Asia/Kolkata
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U gisik" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      # G-9 T1: `workflow-canvas-browser`'s `test` drives a real Chromium against its own Vite harness (:3190).
      - run: pnpm --filter @gisik-nokma/workflow-canvas-browser exec playwright install --with-deps chromium
      # KG-C T1: `knowledge-graph-browser`'s `test` drives a real Chromium against its own Vite harness (:3191).
      - run: pnpm --filter @gisik-nokma/knowledge-graph-browser exec playwright install --with-deps chromium
      # WTG Part 1 T1: `flow-graph-browser`'s `test` drives a real Chromium against its own Vite harness (:3192).
      - run: pnpm --filter @gisik-nokma/flow-graph-browser exec playwright install --with-deps chromium
      - run: pnpm turbo run test --filter='!@gisik-nokma/server'

  # apps/web/e2e (Playwright) needs a deployable stack -- Plan 11 Task 13's
  # docker-compose.dev.yml plus the compose-based E2E harness, neither of
  # which exist on `main` yet (T13 hasn't landed). Rather than a job whose
  # `if:` silently makes it vanish from the run, this one always runs and
  # SAYS in its own log whether it did anything -- the same idiom `scope`
  # already uses for the docs-only skip. Green here means "the stack this
  # suite needs isn't present yet", never "the suite passed".
  e2e:
    needs: scope
    if: needs.scope.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Task 13's real invocation. The job this replaces only DETECTED
      # docker-compose.dev.yml and printed that Task 13 must supply the
      # invocation -- which meant that the moment Task 6 landed that file, this
      # job started reporting GREEN while running nothing. Green-by-absence had
      # become green-by-presence, which is worse: the absence was at least
      # honest about what it did not know.
      #
      # The suite is NOT `apps/web/e2e` (that one is mock-only: every server
      # call is a `page.route` stub and it must never be pointed at a stack it
      # does not touch). It is `apps/web/e2e-stack`, under its own config with
      # no `webServer`, reached by `test:e2e:stack` -- a script name turbo
      # defines no task for, so it stays off `turbo run build test typecheck`
      # structurally rather than by request.
      # NO PRESENCE GATE. An earlier version of this job set an output from
      # `[ -f docker-compose.dev.yml ] && [ -f apps/web/playwright.stack.config.ts ]`
      # and made every step below conditional on it. That re-created, one level
      # up, the exact failure this job was rewritten to remove: rename or move
      # either file and the condition goes false, every step skips, the job
      # SUCCEEDS, and `gate` accepts success — the suite silently stops running
      # while CI stays green. Both files are part of this branch and
      # `test:e2e:stack` is a real script, so their absence is a defect and
      # must fail loudly rather than skip quietly. The docs-only case is
      # already handled by `scope`, which skips this whole job.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile

      # The browser binary is NOT fetched by `pnpm install` -- playwright
      # declares no install script -- so it is an explicit step here and
      # nowhere else. This is the reason the suite must stay off the LOCAL gate.
      - name: install the browser
        run: pnpm --filter @gisik-nokma/web exec playwright install --with-deps chromium

      - name: bring the stack up
        run: docker compose -f docker-compose.dev.yml up -d --build --wait

      # A stack that will not start is a finding about the deployment, which is
      # this job's whole subject -- never a reason to report green.
      - name: the stack did not come up
        if: failure()
        run: |
          echo "THE COMPOSE STACK FAILED TO START. Container state and logs follow."
          docker compose -f docker-compose.dev.yml ps || true
          # WHY a container is unhealthy: the healthcheck's own last outputs, and the probe run by hand.
          for c in $(docker compose -f docker-compose.dev.yml ps -aq); do
            docker inspect --format '{{.Name}} {{json .State.Health}}' "$c" || true
          done
          docker compose -f docker-compose.dev.yml exec -T server wget -S -O- http://localhost:3000/healthz || true
          docker compose -f docker-compose.dev.yml logs --tail=100 || true

      # Seeding and user creation happen inside the suite's own globalSetup,
      # which also REFUSES the run unless what is listening is really the stack.
      # The spec files import `@gisik-nokma/domain` (smoke.spec.ts: `newUlid`), which resolves to
      # its `dist/`; this job installs but does not build, so without this the run dies with
      # `Cannot find module '…/domain/dist/index.js'` (run 36971568470). 13.1728.
      - name: build the workspace packages the E2E specs import
        run: pnpm turbo run build --filter=@gisik-nokma/domain

      - name: run the deployed-stack E2E
        env:
          # passkey-registration.spec.ts logs its WebAuthn setup, console and request trail (13.1731).
          GISIK_E2E_DIAG: "1"
        run: pnpm run test:e2e:stack

      - name: stack logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml logs --tail=200 || true
          # the registration ceremony's server side, for the passkey hang (13.1731)
          docker compose -f docker-compose.dev.yml logs --no-color --tail=800 server | grep -i "passkey\|webauthn\|/v1/auth\|error" || true

      - name: upload the E2E traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-stack-test-results
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: tear the stack down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v || true

  # ── THE VIEWPORT SUITE, ON THE GATE AT LAST ─────────────────────────────
  #
  # Pre-launch item 7 — "actually check in a real viewport, not just visually
  # inspect the code". `apps/web/playwright.viewport.config.ts` was reachable
  # only by an explicit `-c` spelling that no turbo task defined and that this
  # file never named: grepped, the string `viewport` occurred **0 times** here
  # while the same invocation found `e2e` nine times and `test:e2e:stack`
  # three. The suite ran only when a human remembered to run it.
  #
  # The consequence was measured, not hypothetical. The `/help` tap-target
  # ratchet sat at **25 / 23 / 25** offenders at 390 / 768 / 1512 against
  # recorded baselines of **10 / 16 / 16** — red on `main`, for as long as the
  # topic sidebar has existed, seen by nobody. That particular red is fixed
  # (the checker now agrees with the product's own 24px in-list floor and the
  # baselines were re-recorded DOWN to 0). This job is what keeps the NEXT one
  # from being invisible.
  #
  # ⚠ WHY THIS IS A JOB AND NOT A TURBO TASK — two independent reasons, and
  # the first one is the dangerous one:
  #
  #   1. A check whose result turbo may REPLAY FROM CACHE is a check that can
  #      go green without ever running. This repository has already paid for
  #      that exact escape: the `@gisik-nokma/ui#test` entry in `turbo.json`
  #      records `#270` reaching `main` because a cached task replayed a green
  #      log over a real violation. A browser suite is the worst possible
  #      candidate for a replayable verdict.
  #   2. It needs a chromium binary that `pnpm install` does NOT fetch
  #      (Playwright declares no install script) and a `next dev` server it
  #      owns on a port of its own. Folding either into the `test` task would
  #      put a browser download and a long-lived server on the critical path
  #      of every local `pnpm test`, which is how a check gets routed around.
  #      `pnpm test:e2e:viewport` at the repo root is the local entry point.
  #
  # SELF-CONTAINED BY CONSTRUCTION, verified rather than assumed: the suite
  # starts its OWN `next dev` on **3021** — never 3001, and
  # `reuseExistingServer: false`, so an occupied port is a loud stop rather
  # than a silent adoption of whatever else is listening — and every spec that
  # reaches an API route stubs it with `page.route` (16 call sites). **No
  # Postgres, no compose stack, no secrets.** That is why this job needs
  # neither the `services:` block the test jobs carry nor the stack `e2e`
  # brings up.
  viewport:
    needs: [scope, build]
    # Spelled out rather than relied on implicitly, for the same reason the
    # three jobs above spell it out: whether Actions' own default needs-success
    # gating already covers this was never verified against a real run.
    if: needs.scope.outputs.code_changed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Same key as `build`, restored so the packages below are not rebuilt
      # from source. The safety property is the one the `build` job states:
      # the controller's own pre-merge gate runs `--force` and never consults
      # this cache, so a hit here cannot become the merge decision.
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # The suite drives `next dev` from the WORKING TREE, so the workspace
      # packages it imports BY NAME must be built: `@gisik-nokma/app-core`
      # resolves through `packages/app-core/dist`, and a missing or stale dist
      # is a false reading of this tree in BOTH directions — the repository has
      # recorded a false red and a false green from that one cause.
      - run: pnpm turbo run build
      # Not fetched by `pnpm install`; the one step this suite needs that the
      # test jobs do not.
      - name: install the browser
        run: pnpm --filter @gisik-nokma/web exec playwright install --with-deps chromium
      - name: the signed-out viewport suite — all three widths
        run: pnpm run test:e2e:viewport
      # A browser suite that fails with no artefact is a suite people learn to
      # route around. `playwright.viewport.config.ts` sets `trace:
      # 'retain-on-failure'`, so the evidence exists — this is what gets it out
      # of the runner.
      - name: viewport traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: viewport-traces
          path: apps/web/test-results/
          retention-days: 7
          # `warn` is the action's default and it is the wrong one here. The
          # likeliest failure of this job is `next dev` never coming up on 3021,
          # which produces NO `test-results/` directory — so the default would
          # upload nothing, warn, and let the job report a browser failure with
          # no downloadable evidence, which is indistinguishable from a config
          # that dropped the traces. The step's whole reason to exist is that a
          # failure here is otherwise a mystery; make its absence loud.
          if-no-files-found: error

  # The single check name the auto-merge precondition and any branch
  # protection rule reads. Fans in every job above; treats a job's own
  # "skipped" (the expected shape on a docs-only change, or when a later job
  # never got to run because an earlier `needs` dependency failed) as fine,
  # and anything else (failure, cancelled, timed_out) as not.
  gate:
    if: always()
    needs:
      [scope, check-env, check-runbook, check-citations, check-help, check-tasks, check-migrations, build, typecheck, server-tests, other-tests, e2e, viewport]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: require every job succeeded or was legitimately skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # The ${...} below are JS template-literal syntax for `node -e`,
          # not shell expansions -- the single quotes are deliberate so the
          # shell leaves them alone.
          # shellcheck disable=SC2016
          node -e '
            const data = JSON.parse(process.env.NEEDS_JSON);
            const rows = Object.entries(data).map(([name, v]) => `${name}=${v.result}`);
            console.log("job results:", rows.join(", "));
            const bad = Object.entries(data).filter(([, v]) => !["success", "skipped"].includes(v.result));
            if (bad.length) {
              console.error("FAILED:", bad.map(([n, v]) => `${n}=${v.result}`).join(", "));
              process.exit(1);
            }
          '
