# The full dev stack. One command:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# DEVIATIONS FROM PLAN 11 TASK 6'S TEXT (each measured; see
# apps/server/test/deploy/compose-dev-contract.test.ts for the falsifiable
# assertions that hold these in place):
#
#   1. Postgres is on host port 54330, NOT 54329. The plan pinned 54329
#      deliberately ("kept identical here so every documented DATABASE_URL
#      works against either stack ... run one stack or the other, never
#      both") — but 54329 is now the live shared TEST Postgres that five
#      parallel lanes run against. Binding it here would either fail to
#      start (port already taken) or, worse, succeed against the wrong
#      container if the test stack were briefly down. CONSEQUENCE: this
#      stack and the root docker-compose.yml are now co-runnable — which the
#      plan explicitly did not want — and a single documented DATABASE_URL
#      no longer serves both stacks. The dev-stack section of .env.example
#      documents 54330 as the dev value.
#
#   2. Object-store variables use the OBJECT_STORE_S3_* names the code
#      actually reads (apps/server/src/attachments/store-config.ts), with
#      OBJECT_STORE=s3. The plan's S3_ENDPOINT/S3_REGION/S3_BUCKET/
#      S3_ACCESS_KEY/S3_SECRET_KEY/S3_FORCE_PATH_STYLE are read by nothing —
#      written verbatim, createObjectStoreFromEnv would fall through to
#      OBJECT_STORE=local (its default) and attachments would silently sit
#      on the container-local disk store instead of reaching MinIO.
#
#   3. BACKUP_S3_BUCKET is intentionally OMITTED from the server service:
#      nothing reads it on this branch (0 hits in apps/server/src at this
#      HEAD). It belongs to Lane C's backup work, branch
#      exec/30-plan11-backups, Plan 11 Task 11/12 — setting a variable no
#      code reads would be exactly the kind of undocumented-intent env var
#      this task is trying to avoid. The `gisik-backups` bucket is still
#      pre-created below (a bucket is cheap and Lane C's restore drill will
#      need it already existing).
#
#   4. Every image tag is pinned, including minio, mailpit and minio/mc,
#      which the plan left floating (minio/minio:latest, axllent/mailpit,
#      minio/mc) while pinning postgres:16-alpine. A floating tag makes "the
#      stack comes up healthy" unreproducible.
#
#   5. The MinIO healthcheck uses the server's own /minio/health/live
#      endpoint via curl, not the plan's ["CMD","mc","ready","local"].
#      Verified 2026-09-06 with `docker run --rm --entrypoint sh
#      minio/minio:<pinned> -c 'mc ready local'` — it happens to work
#      against this tag (the image ships a pre-seeded "local" mc alias) —
#      but that behavior is undocumented upstream and not something to
#      depend on. `curl -f http://localhost:9000/minio/health/live` is
#      MinIO's own documented liveness endpoint, confirmed present and
#      returning 200 in the same image, and it does not depend on an
#      implicit alias.
#
#   6. The server's environment is checked against apps/server/src/config.ts's
#      zod schema: every key with NO `.default()` (DATABASE_URL,
#      BETTER_AUTH_URL, BETTER_AUTH_SECRET, WEB_ORIGIN) is set below, plus
#      OBJECT_STORE/OBJECT_STORE_S3_* (validated separately, in
#      store-config.ts, not through config.ts's schema — see deviation 2).
#      A missing required key otherwise surfaces only as a runtime
#      ConfigError, which apps/server/test/deploy/compose-dev-contract.test.ts
#      now catches ahead of `docker compose up`.
#
# Postgres keeps `-c timezone=Asia/Kolkata` and the server keeps
# TZ=Asia/Kolkata — owner decision 2026-08-20, matching the root
# docker-compose.yml, unaffected by any of the above.
services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    environment:
      POSTGRES_USER: gisik
      POSTGRES_PASSWORD: gisik
      POSTGRES_DB: gisik_nokma
    ports:
      # Deviation 1: 54330, not the plan's 54329 (see header comment).
      - "54330:5432"
    volumes:
      - pg-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gisik -d gisik_nokma"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Deviation 4: pinned, not minio/minio:latest.
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gisik
      MINIO_ROOT_PASSWORD: gisik-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Deviation 5: MinIO's own liveness endpoint, not `mc ready local`
      # (see header comment for what was verified and why).
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio-init:
    # Deviation 4: pinned, not minio/mc.
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    # gisik-backups (Deviation 3): pre-created for Lane C's backup work
    # (exec/30-plan11-backups, Plan 11 T11/T12) even though nothing on this
    # branch writes to it yet.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gisik gisik-dev-secret &&
      mc mb --ignore-existing local/gisik-attachments &&
      mc mb --ignore-existing local/gisik-backups
      "

  mailpit:
    # Deviation 4: pinned, not axllent/mailpit.
    image: axllent/mailpit:v1.21.3
    ports:
      - "8025:8025"
      - "1025:1025"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      # Deviation 1: point at postgres:5432 inside the compose network — the
      # host-side remap to 54330 is irrelevant here, containers talk over
      # the internal port.
      DATABASE_URL: postgres://gisik:gisik@postgres:5432/gisik_nokma
      TZ: Asia/Kolkata          # process clock == database clock == product clock
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: info
      WEB_ORIGIN: http://localhost:3001
      TRUST_PROXY: "false"
      RATE_LIMIT_AUTH_MAX: "60"
      RATE_LIMIT_EVENTS_MAX: "600"
      RATE_LIMIT_WINDOW_SEC: "60"
      SMTP_URL: smtp://mailpit:1025
      MAGIC_LINK_FROM: sign-in@gisik-nokma.local
      BETTER_AUTH_SECRET: dev-only-secret-do-not-deploy-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      # Deviation 2: OBJECT_STORE_S3_* — the names store-config.ts actually
      # reads — not the plan's bare S3_* names.
      OBJECT_STORE: s3
      OBJECT_STORE_S3_ENDPOINT: http://minio:9000
      OBJECT_STORE_S3_REGION: us-east-1
      OBJECT_STORE_S3_BUCKET: gisik-attachments
      OBJECT_STORE_S3_ACCESS_KEY_ID: gisik
      OBJECT_STORE_S3_SECRET_ACCESS_KEY: gisik-dev-secret
      OBJECT_STORE_S3_FORCE_PATH_STYLE: "true"
      # Deviation 3: BACKUP_S3_BUCKET deliberately absent — see header comment.
    ports:
      - "3000:3000"
    volumes:
      - ./reference:/app/reference:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_WS_URL: ws://localhost:3000/v1/stream
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  pg-dev-data:
  minio-data:
