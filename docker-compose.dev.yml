# The full dev stack. One command:
#   docker compose -f docker-compose.dev.yml up -d --build
#
# DEVIATIONS FROM PLAN 11 TASK 6'S TEXT (each measured; see
# apps/server/test/deploy/compose-dev-contract.test.ts for the falsifiable
# assertions that hold these in place):
#
#   1. Postgres is on host port 54330, NOT 54329. The plan pinned 54329
#      deliberately ("kept identical here so every documented DATABASE_URL
#      works against either stack ... run one stack or the other, never
#      both") — but 54329 is now the live shared TEST Postgres that five
#      parallel lanes run against. Binding it here would either fail to
#      start (port already taken) or, worse, succeed against the wrong
#      container if the test stack were briefly down.
#
#      CONSEQUENCE: this stack and the root docker-compose.yml are now
#      co-runnable — which the plan explicitly did not want — and a single
#      documented DATABASE_URL no longer serves both stacks. The dev-stack
#      section of .env.example documents 54330 as the dev value.
#
#      THAT CO-RUNNABILITY IS NOT FREE, AND THE FIRST VERSION OF THIS FILE
#      CLAIMED IT WITHOUT EARNING IT — caught by review, measured, not
#      argued. Compose derives its project name from the DIRECTORY, so both
#      files resolved to project `lane5-plan11` and BOTH declare a service
#      literally named `postgres`:
#        docker compose -f docker-compose.yml     --dry-run up -d
#          -> Container lane5-plan11-postgres-1
#        docker compose -f docker-compose.dev.yml --dry-run up -d postgres
#          -> Container lane5-plan11-postgres-1
#      Same project, same service name: bringing up either one RECREATES the
#      other's container rather than running beside it, so 54329 would stop
#      answering the moment someone followed .env.example's advice to use
#      both. Different host ports do not separate two stacks; different
#      project names do. The `name:` below is what makes the paragraph above
#      true, and `compose-dev-contract.test.ts` asserts it is set and
#      distinct — a claim in a comment that nothing checks is how the false
#      version survived being written in the first place.
#
#   2. Object-store variables use the OBJECT_STORE_S3_* names the code
#      actually reads (apps/server/src/attachments/store-config.ts), with
#      OBJECT_STORE=s3. The plan's S3_ENDPOINT/S3_REGION/S3_BUCKET/
#      S3_ACCESS_KEY/S3_SECRET_KEY/S3_FORCE_PATH_STYLE are read by nothing —
#      written verbatim, createObjectStoreFromEnv would fall through to
#      OBJECT_STORE=local (its default) and attachments would silently sit
#      on the container-local disk store instead of reaching MinIO.
#
#   3. BACKUP_S3_BUCKET is SET on the server service, pointed at the
#      `gisik-backups` bucket minio-init pre-creates below.
#
#      It used to be intentionally omitted, and the reason was good: nothing
#      read it (measured, 0 hits in apps/server/src), and setting a variable
#      no code reads is exactly the undocumented-intent env var this file
#      avoids. That premise expired when Lane C's backup work merged —
#      re-running the comment's own control at this HEAD gives FIVE hits
#      (`backup-daemon-main.ts`, `fetch-backup.ts`, `object-sink.ts`), and
#      `ops:backup-once` is a real script. Without the variable, the
#      runbook's in-container rehearsal
#      (`node dist/ops/backup-daemon-main.js --once`) refuses with
#      "backup object storage needs: BACKUP_S3_BUCKET" — which is how case
#      13.195's unrun docker half surfaced it.
#
#      A comment that names its own measurement is worth more than one that
#      states a conclusion: this one could be re-run and was.
#
#   4. Every image tag is pinned, including minio and mailpit, which the plan
#      left floating (minio/minio:latest, axllent/mailpit, minio/mc) while
#      pinning postgres:16-alpine. A floating tag makes "the stack comes up
#      healthy" unreproducible.
#
#      MinIO and its client share ONE image, `ghcr.io/coollabsio/minio`
#      (2026-10-02, CI repair). Docker Hub's `minio/minio` and `minio/mc` no
#      longer resolve at all (every tag, `latest` included, answers "pull access
#      denied"; measured with `docker manifest inspect`), which is what turned
#      the CI `e2e` job red at "bring the stack up", and `quay.io/minio/*` has
#      none of our old tags either. coollabsio publishes the community build of
#      the upstream source with the same layout (`minio` and `mc` both in
#      /usr/bin, root, `/data`), amd64 and arm64. Verified on linux/amd64:
#      `server /data` starts with the same MINIO_ROOT_* variables and the
#      minio-init commands below create both buckets. The tag is an exact
#      RELEASE, not a floating one.
#
#   5. The MinIO healthcheck is `mc ready` against an alias the check sets
#      itself, not the plan's bare `mc ready local`, which leans on a
#      pre-seeded "local" alias that is undocumented upstream. The image
#      carries no `curl` (the previous image did, and the check used MinIO's
#      /minio/health/live through it), but it does carry `mc`, which asks the
#      server the same question and needs no other binary.
#
#   6. The server's environment is checked against apps/server/src/config.ts's
#      zod schema: every key with NO `.default()` (DATABASE_URL,
#      BETTER_AUTH_URL, BETTER_AUTH_SECRET, WEB_ORIGIN) is set below, plus
#      OBJECT_STORE/OBJECT_STORE_S3_* (validated separately, in
#      store-config.ts, not through config.ts's schema — see deviation 2).
#      A missing required key otherwise surfaces only as a runtime
#      ConfigError, which apps/server/test/deploy/compose-dev-contract.test.ts
#      now catches ahead of `docker compose up`.
#
# Postgres keeps `-c timezone=Asia/Kolkata` and the server keeps
# TZ=Asia/Kolkata — owner decision 2026-08-20, matching the root
# docker-compose.yml, unaffected by any of the above.
# The project name, which is load-bearing rather than cosmetic — see deviation
# 1. Without it compose infers `lane5-plan11` from the directory, which is also
# what the root docker-compose.yml infers, and the two stacks clobber each
# other's containers.
name: gisik-nokma-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    environment:
      POSTGRES_USER: gisik
      POSTGRES_PASSWORD: gisik
      POSTGRES_DB: gisik_nokma
    ports:
      # Deviation 1: 54330, not the plan's 54329 (see header comment).
      - "54330:5432"
    volumes:
      - pg-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gisik -d gisik_nokma"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Deviation 4: pinned, not minio/minio:latest (see the header: that image is gone).
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gisik
      MINIO_ROOT_PASSWORD: gisik-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # Deviation 5: `mc ready` against an alias set here (see header comment).
      test: ["CMD-SHELL", "mc alias set h http://localhost:9000 gisik gisik-dev-secret >/dev/null && mc ready h"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio-init:
    # Deviation 4: pinned, not minio/mc. The same image as `minio`: it ships `mc`.
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    depends_on:
      minio:
        condition: service_healthy
    # gisik-backups (Deviation 3): the backup daemon writes here now that
    # Lane C's work has merged — `BACKUP_S3_BUCKET` on the server service
    # names this bucket.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gisik gisik-dev-secret &&
      mc mb --ignore-existing local/gisik-attachments &&
      mc mb --ignore-existing local/gisik-backups
      "

  mailpit:
    # Deviation 4: pinned, not axllent/mailpit.
    image: axllent/mailpit:v1.21.3
    ports:
      - "8025:8025"
      - "1025:1025"

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      # Deviation 1: point at postgres:5432 inside the compose network — the
      # host-side remap to 54330 is irrelevant here, containers talk over
      # the internal port.
      DATABASE_URL: postgres://gisik:gisik@postgres:5432/gisik_nokma
      TZ: Asia/Kolkata          # process clock == database clock == product clock
      HOST: 0.0.0.0
      PORT: "3000"
      LOG_LEVEL: info
      WEB_ORIGIN: http://localhost:3001
      TRUST_PROXY: "false"
      RATE_LIMIT_AUTH_MAX: "60"
      RATE_LIMIT_EVENTS_MAX: "600"
      RATE_LIMIT_WINDOW_SEC: "60"
      SMTP_URL: smtp://mailpit:1025
      MAGIC_LINK_FROM: sign-in@gisik-nokma.local
      BETTER_AUTH_SECRET: dev-only-secret-do-not-deploy-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      # Social sign-in, DECLARED AND EMPTY. Real values never come here — this
      # file is committed. The owner supplies them from an untracked `.env`
      # beside it (compose substitutes `${VAR}` from that file automatically) or
      # from their shell.
      #
      # The keys are present rather than absent on purpose: an empty pair is
      # what makes the provider OFF, and this is the file that shows an operator
      # WHICH knobs exist. Before this round the dev stack set nothing at all
      # and `/sign-in` still rendered a Google button — the exact defect, and it
      # was invisible partly because nothing here named the variable.
      #
      # Google works on localhost; register
      # `http://localhost:3000/api/auth/callback/google` as a redirect URI (the
      # API's port, not the web app's). APPLE DOES NOT WORK ON LOCALHOST — Sign
      # in with Apple requires HTTPS and a verified domain, so these three stay
      # empty here and the button stays hidden on the dev stack by design.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      APPLE_CLIENT_ID: "${APPLE_CLIENT_ID:-}"
      APPLE_CLIENT_SECRET: "${APPLE_CLIENT_SECRET:-}"
      APPLE_APP_BUNDLE_IDENTIFIER: "${APPLE_APP_BUNDLE_IDENTIFIER:-}"
      # The hosted MCP door (remote-MCP plan Task 11). DECLARED AND EMPTY: unset
      # means `/mcp`, `/oauth/*` and the OAuth metadata are 404, exactly as in a
      # deploy that has not set it. To try the door on this stack, export
      # `MCP_PUBLIC_URL=http://localhost:3000` (the API's port, which is where the
      # issuer and the endpoints live) before `ctl rebuild`, or put it in the
      # untracked `.env` beside this file.
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-}"
      # Deviation 2: OBJECT_STORE_S3_* — the names store-config.ts actually
      # reads — not the plan's bare S3_* names.
      OBJECT_STORE: s3
      OBJECT_STORE_S3_ENDPOINT: http://minio:9000
      OBJECT_STORE_S3_REGION: us-east-1
      OBJECT_STORE_S3_BUCKET: gisik-attachments
      OBJECT_STORE_S3_ACCESS_KEY_ID: gisik
      OBJECT_STORE_S3_SECRET_ACCESS_KEY: gisik-dev-secret
      OBJECT_STORE_S3_FORCE_PATH_STYLE: "true"
      # Deviation 3: the backup daemon's sink, deliberately a DISTINCT bucket
      # from OBJECT_STORE_S3_BUCKET — backups and attachments never share one.
      BACKUP_S3_BUCKET: gisik-backups
    ports:
      - "3000:3000"
    volumes:
      - ./reference:/app/reference:ro
    healthcheck:
      # 127.0.0.1, NOT localhost: the server listens on IPv4 only, and on a CI runner the container has an IPv6 loopback, so busybox wget resolves localhost to ::1 first and is REFUSED (never falling back); Docker Desktop has no ::1 and falls back, which hid this locally (13.1727).
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz > /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Deviation 7: the two build args apps/web ACTUALLY reads. The plan
        # named NEXT_PUBLIC_API_URL and NEXT_PUBLIC_WS_URL; both have ZERO
        # readers in apps/ or packages/ (measured; positive control at the same
        # commit: SERVER_ORIGIN 20 hits, NEXT_PUBLIC_SERVER_URL 4). turbo.json's
        # globalEnv already lists the correct pair and not the plan's, so under
        # turbo 2's envMode:strict the plan's names would arrive at `next build`
        # as undefined even if something read them.
        #
        # Both bind at BUILD time, which is why they are `args` and not
        # `environment`. next.config.ts's rewrites() runs during `next build`
        # and its result is serialised into .next/routes-manifest.json, which
        # the standalone server reads; measured on this repo's own build output,
        # an unset SERVER_ORIGIN bakes "/v1/:path*" -> "http://localhost:3000/..."
        # literally into that manifest.
        #
        # SERVER_ORIGIN is server-side: the Next process inside THIS container
        # dials it, so it must be the compose service name. What `localhost:3000`
        # actually does here was MEASURED against a live stack rather than
        # predicted, and the prediction was wrong in a way worth recording — the
        # first guess (and the wording this comment carried until the control was
        # run) was that Next would proxy back into itself and answer its own 404.
        # It does not. It attempts the hop and cannot make it:
        #     Failed to proxy http://localhost:3000/v1/me/work
        #     [Error: connect EADDRNOTAVAIL 127.0.0.1:3000 - Local (0.0.0.0:0)]
        #   then [Error: socket hang up] { code: 'ECONNRESET' }
        # and the caller gets **HTTP 500 after a 30-second hang**, not a fast
        # 404. The real symptom is worse than the predicted one, and nothing
        # else looks wrong while it happens: the server is healthy, the web
        # container is Up, and `GET :3001/` still serves its own pages (307).
        # Only the proxied path fails. NEXT_PUBLIC_SERVER_URL is the opposite
        # kind of variable: baked into the browser bundle for the /v1/stream
        # socket (rewrites deliberately do not cover protocol upgrades), so it
        # names the host-published port, not the service.
        SERVER_ORIGIN: http://server:3000
        NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  pg-dev-data:
  minio-data:
